<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f6f5ff">
  <title>15スライディングパズル</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 14px; background: #f6f5ff; color: #20233c; font-family: system-ui, sans-serif; touch-action: manipulation; }
    main { width: min(100%, 460px); text-align: center; }
    h1 { margin: 0 0 4px; font-size: clamp(1.35rem, 6vw, 2rem); }
    .sub { margin: 0 0 14px; color: #777b91; font-size: .9rem; }
    .stats { display: flex; justify-content: space-between; margin: 0 auto 10px; max-width: 400px; font-size: .9rem; font-weight: 700; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; width: min(100%, 400px); aspect-ratio: 1; margin: auto; padding: 8px; border-radius: 18px; background: #dedcf4; box-shadow: 0 8px 20px #45417b18; }
    .tile { display: grid; place-items: center; min-width: 0; border: 0; border-radius: 12px; background: white; color: #5345d5; font-size: clamp(1.3rem, 8vw, 2.25rem); font-weight: 850; box-shadow: 0 3px 0 #c8c5e4; cursor: pointer; touch-action: manipulation; }
    .tile:active { transform: translateY(2px); box-shadow: 0 1px 0 #c8c5e4; }
    .tile.empty { visibility: hidden; }
    .actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
    button.action { border: 0; border-radius: 10px; padding: 11px 17px; background: #6557ed; color: white; font: inherit; font-weight: 750; cursor: pointer; }
    button.action.secondary { background: #e8e7f6; color: #5148a8; }
    #message { min-height: 1.5em; margin: 12px 0 0; color: #5748d4; font-weight: 750; }
  </style>
</head>
<body>
  <main>
    <h1>15スライディングパズル</h1>
    <p class="sub">タイルを動かして1〜15に並べよう</p>
    <div class="stats"><span>手数: <b id="moves">0</b></span><span>ベスト: <b id="best">—</b></span></div>
    <div id="board" class="board" role="group" aria-label="スライディングパズル盤面"></div>
    <div class="actions">
      <button id="shuffle" class="action" type="button">シャッフル</button>
      <button id="reset" class="action secondary" type="button">やり直す</button>
    </div>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const boardElement = document.getElementById("board");
      const movesElement = document.getElementById("moves");
      const bestElement = document.getElementById("best");
      const messageElement = document.getElementById("message");
      const storageKey = "vault_15-sliding-puzzle_best";
      let board = [];
      let moves = 0;
      let best = Number(localStorage.getItem(storageKey)) || 0;

      function isSolved() {
        return board.slice(0, 15).every((value, index) => value === index + 1) && board[15] === 0;
      }

      function render() {
        boardElement.replaceChildren();
        board.forEach((value, index) => {
          const tile = document.createElement("button");
          tile.type = "button";
          tile.className = value === 0 ? "tile empty" : "tile";
          tile.textContent = value === 0 ? "" : String(value);
          tile.setAttribute("aria-label", value === 0 ? "空白" : `タイル ${value}`);
          tile.disabled = value === 0;
          tile.addEventListener("click", () => move(index));
          boardElement.append(tile);
        });
        movesElement.textContent = String(moves);
        bestElement.textContent = best ? String(best) : "—";
      }

      function move(index) {
        const empty = board.indexOf(0);
        const adjacent = Math.abs(Math.floor(index / 4) - Math.floor(empty / 4)) + Math.abs(index % 4 - empty % 4) === 1;
        if (!adjacent || isSolved()) return;
        [board[index], board[empty]] = [board[empty], board[index]];
        moves += 1;
        messageElement.textContent = "";
        if (isSolved()) {
          if (!best || moves < best) {
            best = moves;
            localStorage.setItem(storageKey, String(best));
          }
          messageElement.textContent = `クリア！ ${moves}手で完成しました。`;
        }
        render();
      }

      function shuffle() {
        board = Array.from({ length: 16 }, (_, index) => (index + 1) % 16);
        let previousEmpty = -1;
        for (let step = 0; step < 180; step += 1) {
          const empty = board.indexOf(0);
          const choices = [empty - 4, empty + 4, ...(empty % 4 ? [empty - 1] : []), ...(empty % 4 < 3 ? [empty + 1] : [])]
            .filter((index) => index >= 0 && index < 16 && index !== previousEmpty);
          const next = choices[Math.floor(Math.random() * choices.length)];
          [board[empty], board[next]] = [board[next], board[empty]];
          previousEmpty = empty;
        }
        if (isSolved()) [board[14], board[15]] = [board[15], board[14]];
        moves = 0;
        messageElement.textContent = "";
        render();
      }

      document.getElementById("shuffle").addEventListener("click", shuffle);
      document.getElementById("reset").addEventListener("click", () => {
        board = Array.from({ length: 16 }, (_, index) => (index + 1) % 16);
        moves = 0;
        messageElement.textContent = "";
        render();
      });
      document.addEventListener("keydown", (event) => {
        const empty = board.indexOf(0);
        const delta = { ArrowUp: 4, ArrowDown: -4, ArrowLeft: 1, ArrowRight: -1 }[event.key];
        if (delta === undefined) return;
        event.preventDefault();
        const index = empty + delta;
        if (index >= 0 && index < 16 && (Math.abs(index % 4 - empty % 4) + Math.abs(Math.floor(index / 4) - Math.floor(empty / 4)) === 1)) move(index);
      });
      board = Array.from({ length: 16 }, (_, index) => (index + 1) % 16);
      render();
      shuffle();
    })();
  </script>
</body>
</html>
