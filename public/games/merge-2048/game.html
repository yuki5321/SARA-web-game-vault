<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>2048風ナンバーパズル</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 14px; background: #f6f5ff; color: #20233c; font-family: system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
    main { width: min(100%, 460px); text-align: center; }
    h1 { margin: 0 0 4px; font-size: clamp(1.35rem, 6vw, 2rem); }
    .sub { margin: 0 0 14px; color: #777b91; font-size: .9rem; }
    .stats { display: flex; justify-content: space-between; margin: 0 auto 10px; max-width: 400px; font-size: .95rem; font-weight: 700; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 400px); aspect-ratio: 1; margin: auto; padding: 8px; border-radius: 18px; background: #dedcf4; }
    .tile { display: grid; place-items: center; border-radius: 10px; background: #ecebfa; font-weight: 850; font-size: clamp(1.1rem, 6.5vw, 2rem); color: #3d3680; }
    .v2 { background: #fff; } .v4 { background: #ece8ff; } .v8 { background: #c8bfff; } .v16 { background: #a99cff; color: #fff; }
    .v32 { background: #8977ff; color: #fff; } .v64 { background: #6b57f0; color: #fff; } .v128 { background: #f4b942; color: #fff; }
    .v256 { background: #f29b30; color: #fff; } .v512 { background: #ee7a2b; color: #fff; } .v1024 { background: #e5532d; color: #fff; font-size: clamp(.95rem, 5.5vw, 1.7rem); }
    .v2048 { background: #d62f4f; color: #fff; font-size: clamp(.95rem, 5.5vw, 1.7rem); } .vbig { background: #1f2440; color: #fff; font-size: clamp(.8rem, 4.5vw, 1.4rem); }
    button.action { margin-top: 14px; border: 0; border-radius: 10px; padding: 11px 20px; background: #6557ed; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
    #message { min-height: 1.5em; margin: 12px 0 0; color: #5748d4; font-weight: 750; }
  </style>
</head>
<body>
  <main>
    <h1>2048風ナンバーパズル</h1>
    <p class="sub">スワイプで数字を合体させよう</p>
    <div class="stats"><span>スコア: <b id="score">0</b></span><span>ベスト: <b id="best">0</b></span></div>
    <div id="board" class="board" role="group" aria-label="数字盤面"></div>
    <button id="restart" class="action" type="button">やり直す</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const size = 4;
      const storageKey = "vault_merge-2048_best";
      const boardElement = document.getElementById("board");
      const scoreElement = document.getElementById("score");
      const bestElement = document.getElementById("best");
      const messageElement = document.getElementById("message");
      let grid = [];
      let score = 0;
      let best = Number(localStorage.getItem(storageKey)) || 0;
      let won = false;
      let over = false;

      function emptyCells() {
        const cells = [];
        grid.forEach((row, r) => row.forEach((value, c) => { if (!value) cells.push([r, c]); }));
        return cells;
      }

      function addTile() {
        const cells = emptyCells();
        if (!cells.length) return;
        const [r, c] = cells[Math.floor(Math.random() * cells.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      }

      function render() {
        boardElement.replaceChildren();
        grid.flat().forEach((value) => {
          const tile = document.createElement("div");
          tile.className = `tile ${value === 0 ? "" : value > 2048 ? "vbig" : `v${value}`}`;
          tile.textContent = value ? String(value) : "";
          boardElement.append(tile);
        });
        scoreElement.textContent = String(score);
        bestElement.textContent = String(best);
      }

      function slideLine(line) {
        const values = line.filter(Boolean);
        const result = [];
        let gained = 0;
        for (let i = 0; i < values.length; i += 1) {
          if (values[i] === values[i + 1]) {
            result.push(values[i] * 2);
            gained += values[i] * 2;
            i += 1;
          } else {
            result.push(values[i]);
          }
        }
        while (result.length < size) result.push(0);
        return { result, gained };
      }

      function canMove() {
        if (emptyCells().length) return true;
        for (let r = 0; r < size; r += 1) {
          for (let c = 0; c < size; c += 1) {
            if (c + 1 < size && grid[r][c] === grid[r][c + 1]) return true;
            if (r + 1 < size && grid[r][c] === grid[r + 1][c]) return true;
          }
        }
        return false;
      }

      function move(direction) {
        if (over) return;
        let moved = false;
        let gainedTotal = 0;
        const next = grid.map((row) => [...row]);
        for (let i = 0; i < size; i += 1) {
          const line = [];
          for (let j = 0; j < size; j += 1) {
            const [r, c] = direction === "left" ? [i, j] : direction === "right" ? [i, size - 1 - j] : direction === "up" ? [j, i] : [size - 1 - j, i];
            line.push(grid[r][c]);
          }
          const { result, gained } = slideLine(line);
          gainedTotal += gained;
          for (let j = 0; j < size; j += 1) {
            const [r, c] = direction === "left" ? [i, j] : direction === "right" ? [i, size - 1 - j] : direction === "up" ? [j, i] : [size - 1 - j, i];
            if (next[r][c] !== result[j]) moved = true;
            next[r][c] = result[j];
          }
        }
        if (!moved) return;
        grid = next;
        score += gainedTotal;
        if (score > best) {
          best = score;
          localStorage.setItem(storageKey, String(best));
        }
        addTile();
        if (!won && grid.flat().includes(2048)) {
          won = true;
          messageElement.textContent = "2048達成！このまま続けられます。";
        }
        if (!canMove()) {
          over = true;
          messageElement.textContent = `ゲームオーバー！ スコアは${score}点でした。`;
        }
        render();
      }

      function start() {
        grid = Array.from({ length: size }, () => Array(size).fill(0));
        score = 0;
        won = false;
        over = false;
        messageElement.textContent = "";
        addTile();
        addTile();
        render();
      }

      document.addEventListener("keydown", (event) => {
        const direction = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" }[event.key];
        if (!direction) return;
        event.preventDefault();
        move(direction);
      });

      let touchStart = null;
      boardElement.addEventListener("pointerdown", (event) => { touchStart = { x: event.clientX, y: event.clientY }; });
      document.addEventListener("pointerup", (event) => {
        if (!touchStart) return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      });
      document.addEventListener("pointercancel", () => { touchStart = null; });
      document.getElementById("restart").addEventListener("click", start);
      start();
    })();
  </script>
</body>
</html>
