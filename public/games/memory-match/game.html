<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>神経衰弱</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 14px; background: #f6f5ff; color: #20233c; font-family: system-ui, sans-serif; touch-action: manipulation; }
    main { width: min(100%, 460px); text-align: center; }
    h1 { margin: 0 0 4px; font-size: clamp(1.35rem, 6vw, 2rem); }
    .sub { margin: 0 0 14px; color: #777b91; font-size: .9rem; }
    .stats { display: flex; justify-content: space-between; margin: 0 auto 10px; max-width: 400px; font-size: .9rem; font-weight: 700; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 400px); margin: auto; padding: 8px; border-radius: 18px; background: #dedcf4; }
    .card { aspect-ratio: 1; border: 0; border-radius: 12px; background: #6557ed; color: transparent; font-size: clamp(1.6rem, 9vw, 2.6rem); cursor: pointer; box-shadow: 0 3px 0 #4a3fc0; touch-action: manipulation; }
    .card.open, .card.matched { background: #fff; color: inherit; box-shadow: 0 3px 0 #c8c5e4; }
    .card.matched { background: #e6f7ec; box-shadow: none; }
    button.action { margin-top: 14px; border: 0; border-radius: 10px; padding: 11px 20px; background: #6557ed; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
    #message { min-height: 1.5em; margin: 12px 0 0; color: #5748d4; font-weight: 750; }
  </style>
</head>
<body>
  <main>
    <h1>神経衰弱</h1>
    <p class="sub">同じ絵柄を2枚ずつ揃えよう</p>
    <div class="stats"><span>手数: <b id="moves">0</b></span><span>ベスト: <b id="best">—</b></span></div>
    <div id="board" class="board" role="group" aria-label="カード盤面"></div>
    <button id="restart" class="action" type="button">やり直す</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const symbols = ["🍎", "🐶", "🚗", "⭐", "🎈", "🐱", "🍀", "🎵"];
      const storageKey = "vault_memory-match_best";
      const boardElement = document.getElementById("board");
      const movesElement = document.getElementById("moves");
      const bestElement = document.getElementById("best");
      const messageElement = document.getElementById("message");
      let best = Number(localStorage.getItem(storageKey)) || 0;
      let cards = [];
      let opened = [];
      let moves = 0;
      let matchedCount = 0;
      let locked = false;

      function shuffled(list) {
        const copy = [...list];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function updateStats() {
        movesElement.textContent = String(moves);
        bestElement.textContent = best ? String(best) : "—";
      }

      function start() {
        cards = shuffled([...symbols, ...symbols]);
        opened = [];
        moves = 0;
        matchedCount = 0;
        locked = false;
        messageElement.textContent = "";
        boardElement.replaceChildren();
        cards.forEach((symbol, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "card";
          button.textContent = symbol;
          button.setAttribute("aria-label", "裏向きのカード");
          button.addEventListener("click", () => flip(index, button));
          boardElement.append(button);
        });
        updateStats();
      }

      function flip(index, button) {
        if (locked || button.classList.contains("open") || button.classList.contains("matched")) return;
        button.classList.add("open");
        button.setAttribute("aria-label", cards[index]);
        opened.push({ index, button });
        if (opened.length < 2) return;

        moves += 1;
        updateStats();
        const [first, second] = opened;
        opened = [];
        if (cards[first.index] === cards[second.index]) {
          first.button.classList.add("matched");
          second.button.classList.add("matched");
          matchedCount += 2;
          if (matchedCount === cards.length) {
            if (!best || moves < best) {
              best = moves;
              localStorage.setItem(storageKey, String(best));
              updateStats();
            }
            messageElement.textContent = `クリア！ ${moves}手で全部揃いました。`;
          }
          return;
        }
        locked = true;
        window.setTimeout(() => {
          [first, second].forEach(({ button: target }) => {
            target.classList.remove("open");
            target.setAttribute("aria-label", "裏向きのカード");
          });
          locked = false;
        }, 800);
      }

      document.getElementById("restart").addEventListener("click", start);
      start();
    })();
  </script>
</body>
</html>
