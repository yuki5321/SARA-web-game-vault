  setupTouchDragControls() {
    this.input.on('pointerdown', (pointer) => {
      if (!this.isDialogueActive && !this.isTransitionActive && pointer.y < this.cameras.main.height - 85 && pointer.y > 60) {
        this.touchDragTarget = { x: pointer.x, y: pointer.y };
      }
    });

    this.input.on('pointermove', (pointer) => {
      if (!this.isDialogueActive && !this.isTransitionActive && pointer.isDown && pointer.y < this.cameras.main.height - 85 && pointer.y > 60) {
        this.touchDragTarget = { x: pointer.x, y: pointer.y };
      }
    });

    this.input.on('pointerup', () => {
      this.touchDragTarget = null;
    });
  }

  actionUseBomb() {
    if (this.gameIsOver || this.bombCount <= 0 || this.isDialogueActive || this.isTransitionActive) return;

    this.bombCount--;
    this.bombHudText.setText(`🩲x${this.bombCount}`);
    soundManager.playBomb();

    this.cameras.main.shake(550, 0.03);

    this.tweens.add({
      targets: this.bombFlash,
      alpha: 0.85,
      duration: 120,
      yoyo: true,
      onComplete: () => this.bombFlash.setAlpha(0)
    });

    const megaBrief = this.add.image(this.cameras.main.width / 2, this.cameras.main.height / 2, 'bullet_giga')
      .setScale(0.2).setAlpha(0.95).setDepth(240);

    this.tweens.add({
      targets: megaBrief,
      scale: 14,
      alpha: 0,
      angle: 360,
      duration: 750,
      ease: 'Cubic.easeOut',
      onComplete: () => megaBrief.destroy()
    });

    this.enemyLasers.getChildren().forEach(laser => {
      this.createDefeatEffect(laser.x, laser.y);
      laser.destroy();
    });

    this.enemies.getChildren().forEach(enemy => {
      this.damageEnemy(enemy, 25);
    });

    if (this.boss && this.boss.active && this.boss.isReady) {
      this.damageBoss(40);
    }

    this.showComicText(this.cameras.main.width / 2, 280, 'メガ・ブリーフフラッシュ！！', '#f43f5e');
  }

  // =================================================================
  // ★ 会話演出（パンツマンのメッセージ残留バグ完全修正版）
  // =================================================================
  showStoryDialogue(speakerName, iconTexture, message, onComplete) {
    // 既存の会話タイマーやコンテナを完全に破棄して初期化
    this.clearDialogue();

    this.isDialogueActive = true;
    this.player.setVelocity(0, 0);

    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    // 画面全体どこをクリックしても次に進める全画面バリア
    this.dialogueBarrier = this.add.rectangle(width / 2, height / 2, width, height, 0x000000, 0.001)
      .setDepth(199).setInteractive({ useHandCursor: true });

    const dialogGroup = this.add.container(width / 2, height - 195).setDepth(200);

    const bg = this.add.rectangle(0, 0, 370, 95, 0x0f172a, 0.96);
    bg.setStrokeStyle(3, speakerName.includes('パンツ') || speakerName.includes('教頭') ? 0x38bdf8 : 0xef4444);

    const icon = this.add.image(-140, 0, iconTexture).setScale(0.85);

    const nameText = this.add.text(-95, -34, speakerName, {
      fontSize: '12px',
      fontStyle: 'bold',
      color: '#facc15'
    });

    const msgText = this.add.text(-95, -14, message, {
      fontSize: '11px',
      color: '#ffffff',
      lineSpacing: 4
    });

    const nextPrompt = this.add.text(155, 30, '▼ [TAP / SPACE]', {
      fontSize: '9px',
      color: '#94a3b8'
    }).setOrigin(1, 0.5);

    this.tweens.add({
      targets: nextPrompt,
      alpha: 0.3,
      yoyo: true,
      repeat: -1,
      duration: 400
    });

    dialogGroup.add([bg, icon, nameText, msgText, nextPrompt]);
    dialogGroup.setScale(0.8);
    dialogGroup.setAlpha(0);
    this.tweens.add({
      targets: dialogGroup,
      scale: 1,
      alpha: 1,
      duration: 180,
      ease: 'Back.easeOut'
    });

    this.currentDialogGroup = dialogGroup;

    const closeHandler = () => {
      this.clearDialogue();
      if (onComplete) onComplete();
    };

    this.dialogueBarrier.on('pointerdown', closeHandler);
    bg.setInteractive({ useHandCursor: true }).on('pointerdown', closeHandler);

    this.dialogueKeyDownHandler = (e) => {
      if (['Space', 'Enter', 'KeyZ', 'KeyX', 'KeyC'].includes(e.code)) {
        closeHandler();
      }
    };
    window.addEventListener('keydown', this.dialogueKeyDownHandler, { once: true });

    // 3.5秒で自動スキップ
    this.dialogueTimer = this.time.delayedCall(3500, closeHandler);
  }

  clearDialogue() {
    if (this.dialogueTimer) {
      this.dialogueTimer.remove();
      this.dialogueTimer = null;
    }
    if (this.dialogueKeyDownHandler) {
      window.removeEventListener('keydown', this.dialogueKeyDownHandler);
      this.dialogueKeyDownHandler = null;
    }
    if (this.dialogueBarrier) {
      this.dialogueBarrier.destroy();
      this.dialogueBarrier = null;
    }
    if (this.currentDialogGroup) {
      this.currentDialogGroup.destroy();
      this.currentDialogGroup = null;
    }
    this.isDialogueActive = false;
  }

  handleFireRelease() {
    if (this.gameIsOver || this.isDialogueActive || this.isTransitionActive) return;
    if (this.bossSpawned && this.boss && !this.boss.isReady) return;

    this.isPressingFire = false;

    if (this.isChargeReady) {
      this.actionFireChargeShot();
    } else {
      this.actionShootPants();
    }

    this.chargeDuration = 0;
    this.isChargeReady = false;
    this.chargingSoundPlayed = false;
    this.chargeAura.setVisible(false);
    this.chargeBarFill.width = 0;
  }

  actionFireChargeShot() {
    soundManager.playChargeShot();
    this.cameras.main.shake(120, 0.01);
    this.showComicText(this.player.x, this.player.y - 45, 'ギガバースト！', '#facc15');

    const bullet = this.playerBullets.create(this.player.x, this.player.y - 30, 'bullet_giga');
    bullet.setVelocityY(-620);
    bullet.setScale(1.2);
    bullet.damage = 18;
    bullet.isPiercing = true;
    bullet.isGiga = true;
    bullet.body.setSize(48, 38);
    bullet.setBlendMode(Phaser.BlendModes.ADD);

    if (this.hasAlly && this.ally) {
      this.fireAllyShot(true);
    }

    this.tweens.add({
      targets: this.player,
      y: this.player.y + 12,
      yoyo: true,
      duration: 100
    });
  }

  actionShootPants() {
    if (this.gameIsOver || this.isDialogueActive || this.isTransitionActive) return;
    if (this.bossSpawned && this.boss && !this.boss.isReady) return;

    const now = this.time.now;
    if (now - this.lastShotTime < this.shotCooldownMs) return;
    this.lastShotTime = now;

    soundManager.playSnap();

    this.tweens.add({
      targets: this.player,
      scaleX: 1.2,
      scaleY: 0.85,
      yoyo: true,
      duration: 70
    });

    const px = this.player.x;
    const py = this.player.y - 25;

    switch (this.attackLevel) {
      case 1:
        this.createPantsBullet(px, py, 0, -500, 1, 1.0);
        break;
      case 2:
        this.createPantsBullet(px - 10, py, 0, -520, 1.1, 0.85);
        this.createPantsBullet(px + 10, py, 0, -520, 1.1, 0.85);
        break;
      case 3:
        this.createPantsBullet(px, py, 0, -530, 1.15, 0.9);
        this.createPantsBullet(px - 14, py, -110, -500, 1.05, 0.9);
        this.createPantsBullet(px + 14, py, 110, -500, 1.05, 0.9);
        break;
      case 4:
        this.createPantsBullet(px, py, 0, -560, 1.45, 1.8, true);
        this.createPantsBullet(px - 18, py, -80, -520, 1.05, 0.7);
        this.createPantsBullet(px + 18, py, 80, -520, 1.05, 0.7);
        break;
      case 5:
      default:
        this.createPantsBullet(px, py - 5, 0, -600, 1.6, 2.2, true);
        this.createPantsBullet(px - 16, py, -130, -540, 1.15, 0.7);
        this.createPantsBullet(px + 16, py, 130, -540, 1.15, 0.7);
        this.createPantsBullet(px - 28, py + 5, -220, -500, 1.0, 0.7);
        this.createPantsBullet(px + 28, py + 5, 220, -500, 1.0, 0.7);
        break;
    }

    if (this.hasAlly && this.ally) {
      this.fireAllyShot(false);
    }
  }

  fireAllyShot(isCharge = false) {
    if (!this.ally) return;
    soundManager.playAllySnap();

    const ax = this.ally.x;
    const ay = this.ally.y - 15;

    if (isCharge) {
      const b = this.allyBullets.create(ax, ay, 'bullet_ally_mega');
      b.setVelocityY(-560);
      b.damage = 6.0;
      b.isPiercing = true;
      b.body.setSize(30, 24);
      b.setBlendMode(Phaser.BlendModes.ADD);
      return;
    }

    if (this.allyLevel === 1) {
      const b = this.allyBullets.create(ax, ay, 'bullet_ally');
      b.setVelocityY(-540);
      b.damage = 1.3;
      b.body.setSize(16, 12);
    } else if (this.allyLevel === 2) {
      [-7, 7].forEach(offset => {
        const b = this.allyBullets.create(ax + offset, ay, 'bullet_ally');
        b.setVelocityY(-550);
        b.damage = 1.2;
        b.body.setSize(16, 12);
      });
    } else {
      [-80, 0, 80].forEach(vx => {
        const b = this.allyBullets.create(ax, ay, 'bullet_ally');
        b.setVelocity(vx, -540);
        b.damage = 1.4;
        b.body.setSize(16, 12);
      });
    }
  }

  createPantsBullet(x, y, vx, vy, scale = 1, damage = 1, isPiercing = false) {
    const bullet = this.playerBullets.create(x, y, 'bullet_pants');
    bullet.setVelocity(vx, vy);
    bullet.setScale(scale);
    bullet.damage = damage;
    bullet.isPiercing = isPiercing;
    bullet.setAngularVelocity(Phaser.Math.Between(-250, 250));
    bullet.body.setSize(22 * scale, 16 * scale);
  }

  actionActivateShield() {
    if (this.gameIsOver || this.isShieldActive || this.shieldCooldown || this.isDialogueActive || this.isTransitionActive) return;

    this.isShieldActive = true;
    this.shieldGlow.setVisible(true);

    const scale = this.attackLevel >= 4 ? 1.5 : 1.2;
    this.shieldGlow.setScale(scale);

    soundManager.playCape();
    this.showComicText(this.player.x + 24, this.player.y - 45, 'バフッ！', '#38bdf8');

    this.time.delayedCall(450, () => {
      this.isShieldActive = false;
      this.shieldGlow.setVisible(false);
      this.shieldCooldown = true;
      this.btnShield.setAlpha(0.4);

      this.time.delayedCall(480, () => {
        this.shieldCooldown = false;
        this.btnShield.setAlpha(0.9);
      });
    });
  }

  spawnPowerItem(x, y) {
    const item = this.powerItems.create(x, y, 'item_ppants');
    item.setVelocityY(90);
    item.setAngularVelocity(45);
    item.body.setSize(30, 26);

    this.tweens.add({
      targets: item,
      scaleX: 1.25,
      scaleY: 1.25,
      yoyo: true,
      repeat: -1,
      duration: 380
    });
  }

  spawnHealItem(x, y) {
    const item = this.healItems.create(x, y, 'item_paper');
    item.setVelocityY(80);
    item.setAngularVelocity(30);
    item.body.setSize(28, 28);
  }

  applyPowerUp(item) {
    item.destroy();
    soundManager.playPowerUp();

    if (this.attackLevel < 5) {
      this.attackLevel++;
      this.showComicText(this.player.x, this.player.y - 50, `POWER UP! Lv.${this.attackLevel}`, '#facc15');
      if (this.attackLevel === 5) {
        this.showComicText(this.player.x, this.player.y - 75, '★ MAX POWER!! ★', '#ef4444');
      }
    } else {
      this.addScore(800);
      this.showComicText(this.player.x, this.player.y - 50, 'BONUS +800pt!', '#facc15');
    }

    if (this.hasAlly && this.ally) {
      this.allyLevel = Math.min(3, this.allyLevel + 1);
    }

    const starIcons = ['', '★☆☆☆', '★★☆☆', '★★★☆', '★★★★', 'MAX!'];
    this.powerLevelText.setText(`ATK Lv.${this.attackLevel} ${starIcons[this.attackLevel] || ''}`);
    this.powerLevelText.setColor(this.attackLevel === 5 ? '#f87171' : '#facc15');
  }

  applyHeal(item) {
    item.destroy();
    soundManager.playHeal();
    this.hp = Math.min(this.maxHp, this.hp + 30);
    this.updateHpUI();
    this.showComicText(this.player.x, this.player.y - 50, 'HP回復 +30!', '#4ade80');
  }

  playerHit(damage) {
    if (this.isInvincible || this.gameIsOver) return;

    this.hp = Math.max(0, this.hp - damage);
    this.totalDamageTaken += damage;
    this.updateHpUI();

    soundManager.playHurt();
    this.cameras.main.shake(250, 0.015);

    // ピンチ時はノンブロッキングな吹き出しテキストで安全に表示（ゲーム停止しない！）
    if (this.hp <= 35 && !this.pinchDialogueTriggered) {
      this.pinchDialogueTriggered = true;
      this.showComicText(this.player.x, this.player.y - 50, '「くっ…！ゴムの張りが限界だが、\n生徒たちのために倒れん！」', '#f87171');
    }

    if (this.hp <= 0) {
      this.triggerGameOver(false);
      return;
    }

    this.isInvincible = true;
    this.tweens.add({
      targets: this.player,
      alpha: 0.25,
      yoyo: true,
      repeat: 5,
      duration: 110,
      onComplete: () => {
        this.player.setAlpha(1);
        this.isInvincible = false;
      }
    });
  }

  createHitSpark(x, y, color = 0xfde047) {
    for (let i = 0; i < 4; i++) {
      const sp = this.add.circle(x, y, Phaser.Math.Between(2, 4), color, 0.9).setDepth(45);
      sp.setBlendMode(Phaser.BlendModes.ADD);
      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const spd = Phaser.Math.FloatBetween(50, 130);
      this.physics.add.existing(sp);
      sp.body.setVelocity(Math.cos(angle) * spd, Math.sin(angle) * spd);
      this.tweens.add({
        targets: sp,
        alpha: 0,
        scale: 0.1,
        duration: 220,
        onComplete: () => sp.destroy()
      });
    }
  }

  setupColliders() {
    this.physics.add.overlap(this.playerBullets, this.enemies, (bullet, enemy) => {
      this.createHitSpark(bullet.x, bullet.y);
      if (!bullet.isPiercing) bullet.destroy();
      this.damageEnemy(enemy, bullet.damage || 1);
    });

    this.physics.add.overlap(this.allyBullets, this.enemies, (bullet, enemy) => {
      this.createHitSpark(bullet.x, bullet.y, 0x10b981);
      if (!bullet.isPiercing) bullet.destroy();
      this.damageEnemy(enemy, bullet.damage || 1.2);
    });

    this.physics.add.overlap(this.reflectedBullets, this.enemies, (bullet, enemy) => {
      this.createHitSpark(bullet.x, bullet.y, 0xfacc15);
      bullet.destroy();
      this.damageEnemy(enemy, 5);
    });

    this.physics.add.overlap(this.playerBullets, this.enemyLasers, (bullet, laser) => {
      if (bullet.isGiga) {
        this.createDefeatEffect(laser.x, laser.y);
        laser.destroy();
      }
    });

    this.physics.add.overlap(this.player, this.enemyLasers, (player, laser) => {
      if (this.isShieldActive) {
        soundManager.playReflect();
        this.cameras.main.shake(120, 0.007);
        this.totalReflects++;

        const now = this.time.now;
        if (now - this.lastReflectTime < 2000) {
          this.reflectCombo++;
        } else {
          this.reflectCombo = 1;
        }
        this.lastReflectTime = now;

        const comboText = this.reflectCombo > 1 ? `REFLECT x${this.reflectCombo}!` : 'カキーン！';
        this.showComicText(laser.x, laser.y - 20, comboText, '#fef08a');

        const lx = laser.x;
        const ly = laser.y;
        const isDirtyBeam = laser.isDirtyBeam;
        laser.destroy();

        if (this.boss && this.boss.active && this.boss.isReady) {
          const angle = Phaser.Math.Angle.Between(lx, ly, this.boss.x, this.boss.y);
          const refBullet = this.reflectedBullets.create(lx, ly - 10, 'reflected_laser');
          refBullet.setVelocity(Math.cos(angle) * 620, Math.sin(angle) * 620);
          refBullet.body.setSize(16, 26);
          refBullet.setBlendMode(Phaser.BlendModes.ADD);
          if (isDirtyBeam) {
            refBullet.setScale(2.0);
            refBullet.damage = 25;
            this.showComicText(lx, ly - 35, '超・浄化反射！！', '#38bdf8');
          }
        } else {
          const refBullet = this.reflectedBullets.create(lx, ly - 10, 'reflected_laser');
          refBullet.setVelocity(Phaser.Math.Between(-60, 60), -580);
          refBullet.body.setSize(14, 24);
          refBullet.setBlendMode(Phaser.BlendModes.ADD);
        }

        this.addScore(50 * this.reflectCombo);
      } else {
        const dmg = laser.isDirtyBeam ? 25 : 15;
        laser.destroy();
        this.playerHit(dmg);
      }
    });

    this.physics.add.overlap(this.player, this.powerItems, (player, item) => this.applyPowerUp(item));
    this.physics.add.overlap(this.player, this.healItems, (player, item) => this.applyHeal(item));

    this.physics.add.overlap(this.playerBullets, this.boss, (boss, bullet) => {
      if (!this.boss || !this.boss.isReady || this.isDialogueActive || this.isTransitionActive) {
        bullet.destroy();
        return;
      }
      this.createHitSpark(bullet.x, bullet.y);
      const dmg = bullet.damage || 1;
      if (!bullet.isPiercing) bullet.destroy();
      this.damageBoss(dmg);
    });

    this.physics.add.overlap(this.allyBullets, this.boss, (boss, bullet) => {
      if (!this.boss || !this.boss.isReady || this.isDialogueActive || this.isTransitionActive) {
        bullet.destroy();
        return;
      }
      this.createHitSpark(bullet.x, bullet.y, 0x10b981);
      if (!bullet.isPiercing) bullet.destroy();
      this.damageBoss(bullet.damage || 1.2);
    });

    this.physics.add.overlap(this.reflectedBullets, this.boss, (boss, bullet) => {
      if (!this.boss || !this.boss.isReady || this.isDialogueActive || this.isTransitionActive) {
        bullet.destroy();
        return;
      }
      this.createHitSpark(bullet.x, bullet.y, 0xfacc15);
      const dmg = bullet.damage || 12;
      bullet.destroy();
      this.damageBoss(dmg);
    });
  }

  damageEnemy(enemy, damage) {
    enemy.hp -= damage;
    soundManager.playBoom(false);

    enemy.y -= 2;
    this.tweens.add({
      targets: enemy,
      tint: 0xff0000,
      duration: 60,
      yoyo: true,
      onComplete: () => {
        if (enemy && enemy.clearTint) enemy.clearTint();
      }
    });

    if (enemy.hp <= 0) {
      this.stageDefeated++;
      const remain = Math.max(0, this.stageRequiredEnemies - this.stageDefeated);
      if (!this.bossSpawned) {
        this.bossCountText.setText(`BOSSまで: ${remain}体`);
      }

      if (enemy.enemyType === 'bonus') {
        this.spawnPowerItem(enemy.x - 14, enemy.y);
        this.spawnHealItem(enemy.x + 14, enemy.y);
        this.addScore(500);
      } else if (this.stageDefeated <= 2 || Math.random() < 0.35) {
        this.spawnPowerItem(enemy.x, enemy.y);
      } else if (Math.random() < (this.hp < 60 ? 0.35 : 0.18)) {
        this.spawnHealItem(enemy.x, enemy.y);
      }

      this.createDefeatEffect(enemy.x, enemy.y);
      enemy.destroy();
      this.addScore(100);

      if (this.stageDefeated >= this.stageRequiredEnemies && !this.bossSpawned) {
        this.triggerBossSpawn();
      }
    }
  }

  damageBoss(damage) {
    if (!this.boss || this.boss.hp <= 0 || !this.boss.isReady) return;

    this.boss.hp -= damage;
    soundManager.playBoom(false);
    this.cameras.main.shake(50, 0.005);

    this.tweens.add({
      targets: this.boss,
      scaleX: 1.08,
      scaleY: 0.94,
      duration: 50,
      yoyo: true
    });

    const pct = Math.max(0, this.boss.hp / this.bossMaxHp);
    this.bossHpFill.setScale(pct, 1);
    this.bossLabel.setText(`BOSS [HP ${Math.ceil(this.boss.hp)}]`);

    if (this.bossPhase === 1 && this.boss.hp <= this.bossMaxHp * 0.65) {
      this.transitionBossPhase(2);
    } else if (this.bossPhase === 2 && this.boss.hp <= this.bossMaxHp * 0.30) {
      this.transitionBossPhase(3);
    }

    if (this.boss.hp <= 0) {
      this.bossDefeated();
    }
  }

  transitionBossPhase(phase) {
    this.bossPhase = phase;
    this.cameras.main.shake(300, 0.02);

    if (phase === 2) {
      this.showComicText(this.boss.x, this.boss.y - 45, 'PHASE 2 突入！', '#f97316');
      soundManager.playPowerUp();
    } else if (phase === 3) {
      this.showComicText(this.boss.x, this.boss.y - 45, '激怒モード発動！！', '#ef4444');
      soundManager.playBGM('boss_rage');
    }
  }

  updateHpUI() {
    this.hpLabel.setText(`HP ${this.hp}/${this.maxHp}`);
    const pct = this.hp / this.maxHp;
    this.hpBarFill.setScale(pct, 1);

    if (pct < 0.3) {
      this.hpBarFill.setFillStyle(0xef4444);
    } else if (pct < 0.6) {
      this.hpBarFill.setFillStyle(0xeab308);
    } else {
      this.hpBarFill.setFillStyle(0x22c55e);
    }
  }

  spawnEnemyWave() {
    if (this.gameIsOver || this.bossSpawned || this.isDialogueActive || this.isTransitionActive) return;

    const baseMax = this.stage === 1 ? 2 : (this.stage === 2 ? 3 : 4);
    const maxEnemies = Math.max(1, Math.round(baseMax * this.diffConfig.enemyCountMult));
    if (this.enemies.countActive(true) >= maxEnemies) return;

    const width = this.cameras.main.width;
    const rand = Math.random();

    let texture = 'ojisan_normal';
    let hp = 10;
    let type = 'normal';
    let baseSpeed = 1.0;

    if (rand < 0.35) {
      texture = 'ojisan_steteko';
      hp = 8;
      type = 'steteko';
      baseSpeed = 1.6;
    } else if (rand < 0.65) {
      texture = 'ojisan_bucho';
      hp = 22;
      type = 'bucho';
      baseSpeed = 0.85;
    } else if (rand < 0.78) {
      texture = 'ojisan_bonus';
      hp = 14;
      type = 'bonus';
      baseSpeed = 1.3;
    }

    const stageSpeedMult = (this.stage === 1 ? 1.0 : (this.stage === 2 ? 1.45 : 1.75)) * this.diffConfig.speedMult;
    const finalSpeed = baseSpeed * stageSpeedMult;
    const scale = this.stage === 1 ? 1.0 : (this.stage === 2 ? 0.76 : 0.68);

    const x = Phaser.Math.Between(40, width - 40);
    const enemy = this.enemies.create(x, -25, texture);
    enemy.hp = hp;
    enemy.enemyType = type;
    enemy.setScale(scale);
    enemy.body.setSize(32 * scale, 38 * scale);

    if (type === 'steteko') {
      this.tweens.add({
        targets: enemy,
        y: Phaser.Math.Between(110, 230),
        duration: 900 / finalSpeed,
        ease: 'Cubic.easeOut',
        onComplete: () => {
          this.tweens.add({
            targets: enemy,
            x: enemy.x + Phaser.Math.Between(-80, 80),
            yoyo: true,
            repeat: -1,
            duration: 800 / stageSpeedMult,
            ease: 'Sine.easeInOut'
          });
        }
      });
    } else if (type === 'bonus') {
      enemy.y = 110;
      this.tweens.add({
        targets: enemy,
        x: x < width / 2 ? width + 40 : -40,
        duration: 3200 / stageSpeedMult,
        onComplete: () => enemy.destroy()
      });
    } else {
      this.tweens.add({
        targets: enemy,
        y: Phaser.Math.Between(95, 190),
        duration: 1200 / finalSpeed,
        ease: 'Cubic.easeOut',
        onComplete: () => {
          this.tweens.add({
            targets: enemy,
            x: enemy.x + Phaser.Math.Between(-40, 40),
            yoyo: true,
            repeat: -1,
            duration: 1300 / stageSpeedMult,
            ease: 'Sine.easeInOut'
          });
        }
      });
    }

    const fireDelay = Math.max(750, (Phaser.Math.Between(1800, 2600) / stageSpeedMult) / this.diffConfig.fireRateMult);
    this.time.addEvent({
      delay: fireDelay,
      callback: () => {
        if (enemy && enemy.active && !this.gameIsOver && !this.isDialogueActive && !this.isTransitionActive) {
          const flash = this.add.circle(enemy.x, enemy.y + 14 * scale, 5 * scale, 0xef4444, 0.8);
          this.time.delayedCall(150, () => {
            flash.destroy();
            if (enemy && enemy.active && !this.gameIsOver && !this.isDialogueActive && !this.isTransitionActive) {
              if (type === 'bucho') {
                this.enemyFireLaser(enemy.x - 8, enemy.y + 14 * scale, -35);
                this.enemyFireLaser(enemy.x + 8, enemy.y + 14 * scale, 35);
              } else if (type !== 'bonus') {
                this.enemyFireLaser(enemy.x, enemy.y + 14 * scale);
              }
            }
          });
        }
      },
      loop: true
    });
  }

  enemyFireLaser(x, y, speedX = 0, isDirty = false) {
    if (this.gameIsOver || this.isDialogueActive || this.isTransitionActive) return;

    const bSpeedMult = this.diffConfig ? this.diffConfig.bulletSpeedMult : 1.0;

    if (isDirty) {
      soundManager.playDirtyBeam();
      const laser = this.enemyLasers.create(x, y, 'dirty_water_beam');
      laser.setVelocityY(280 * bSpeedMult);
      laser.setVelocityX(speedX * bSpeedMult);
      laser.isDirtyBeam = true;
      laser.body.setSize(20, 32);
      laser.setBlendMode(Phaser.BlendModes.ADD);
    } else {
      soundManager.playLaser();
      const laser = this.enemyLasers.create(x, y, 'enemy_laser');
      laser.setVelocityY(250 * bSpeedMult);
      laser.setVelocityX(speedX * bSpeedMult);
      laser.isDirtyBeam = false;
      laser.body.setSize(8, 16);
      laser.setBlendMode(Phaser.BlendModes.ADD);
    }
  }

  triggerBossSpawn() {
    this.bossSpawned = true;
    this.bossCountText.setText('BOSS 交戦中！');
    soundManager.stopBGM();
    soundManager.playWarning();

    this.enemies.getChildren().forEach(e => {
      this.createDefeatEffect(e.x, e.y);
      e.destroy();
    });

    this.tweens.add({
      targets: this.warningBanner,
      alpha: 1,
      yoyo: true,
      repeat: 4,
      duration: 250,
      onComplete: () => {
        this.warningBanner.setAlpha(0);
        this.spawnBossMech();
      }
    });
  }

  spawnBossMech() {
    const width = this.cameras.main.width;

    if (this.stage === 1) {
      this.boss = this.physics.add.sprite(width / 2, -75, 'boss_toilet');
      this.boss.hp = this.bossMaxHp;
      this.boss.body.setSize(80, 84);
      this.boss.isReady = false;

      this.tweens.add({
        targets: this.boss,
        y: 175,
        duration: 2200,
        ease: 'Back.easeOut',
        onComplete: () => {
          this.showStoryDialogue('トイレマン', 'boss_toilet', '「全校生徒のトイレットペーパーを\nすべて流し尽くしてやる！！」', () => {
            this.showStoryDialogue('パンツマン', 'pantsman', '「校長のプライドにかけて、\n水には流さんぞ！！」', () => {
              this.startBossFight();
            });
          });
        }
      });
    } else if (this.stage === 2) {
      this.boss = this.physics.add.sprite(width / 2, -75, 'boss_fakehero');
      this.boss.hp = this.bossMaxHp;
      this.boss.body.setSize(54, 66);
      this.boss.isReady = false;

      this.tweens.add({
        targets: this.boss,
        y: 165,
        duration: 2000,
        ease: 'Back.easeOut',
        onComplete: () => {
          this.showStoryDialogue('偽ヒーロー', 'boss_fakehero', '「オレこそが真のパンツヒーロー！\n貴様の白ブリーフなど時代遅れだ！」', () => {
            this.showStoryDialogue('パンツマン', 'pantsman', '「黒ブリーフの悪党め！\n白の純潔の輝きを見せてやる！！」', () => {
              this.startBossFight();
            });
          });
        }
      });
    } else if (this.stage === 3) {
      this.boss = this.physics.add.sprite(width / 2, -100, 'boss_giant_toilet');
      this.boss.hp = this.bossMaxHp;
      this.boss.body.setSize(140, 110);
      this.boss.isReady = false;

      this.tweens.add({
        targets: this.boss,
        y: 165,
        duration: 2600,
        ease: 'Back.easeOut',
        onComplete: () => {
          this.showStoryDialogue('巨大トイレ', 'boss_giant_toilet', '「ゴオオオオ…！全世界の水を\n濁った汚水に変えてやる…！！」', () => {
            this.showStoryDialogue('パンツマン', 'pantsman', '「巨大トイレめ！最後の水洗ボタンは\n私たちが押す！！」', () => {
              this.startBossFight();
            });
          });
        }
      });
    }

    this.setupColliders();
  }

  startBossFight() {
    if (!this.boss) return;
    this.clearDialogue();
    this.boss.isReady = true;
    this.bossHpContainer.setVisible(true);
    soundManager.playBGM('boss');
    this.showComicText(this.cameras.main.width / 2, 140, 'BATTLE START!!', '#ef4444');
    this.startBossAttackPatterns();
  }

  startBossAttackPatterns() {
    if (!this.boss || this.gameIsOver) return;

    const bSpeedMult = this.diffConfig.bulletSpeedMult;
    const bFireInterval = Math.round(1300 / this.diffConfig.fireRateMult);

    if (this.stage === 1) {
      this.tweens.add({
        targets: this.boss,
        x: { from: 70, to: this.cameras.main.width - 70 },
        yoyo: true,
        repeat: -1,
        duration: 2000 / this.diffConfig.speedMult,
        ease: 'Sine.easeInOut'
      });

      this.bossFireTimer = this.time.addEvent({
        delay: bFireInterval,
        callback: () => {
          if (!this.boss || !this.boss.active || this.gameIsOver || this.isDialogueActive || this.isTransitionActive || !this.boss.isReady) return;
          if (this.bossPhase === 1) {
            this.enemyFireLaser(this.boss.x - 28, this.boss.y + 36, -50);
            this.enemyFireLaser(this.boss.x + 28, this.boss.y + 36, 50);
          } else {
            [-80, -40, 0, 40, 80].forEach(vx => {
              this.enemyFireLaser(this.boss.x, this.boss.y + 40, vx);
            });
          }
        },
        loop: true
      });
    } else if (this.stage === 2) {
      const s2Interval = Math.round(1100 / this.diffConfig.fireRateMult);
      this.tweens.add({
        targets: this.boss,
        x: { from: 55, to: this.cameras.main.width - 55 },
        yoyo: true,
        repeat: -1,
        duration: 1300 / this.diffConfig.speedMult,
        ease: 'Sine.easeInOut'
      });

      this.bossFireTimer = this.time.addEvent({
        delay: s2Interval,
        callback: () => {
          if (!this.boss || !this.boss.active || this.gameIsOver || this.isDialogueActive || this.isTransitionActive || !this.boss.isReady) return;

          soundManager.playSnap();
          if (this.bossPhase === 1) {
            [-50, -20, 20, 50].forEach(vx => {
              const b = this.enemyLasers.create(this.boss.x, this.boss.y + 30, 'bullet_darkpants');
              b.setVelocity(vx * bSpeedMult, 280 * bSpeedMult);
              b.body.setSize(18, 16);
            });
          } else {
            [-80, -40, 0, 40, 80].forEach(vx => {
              const b = this.enemyLasers.create(this.boss.x, this.boss.y + 30, 'bullet_darkpants');
              b.setVelocity(vx * bSpeedMult, 300 * bSpeedMult);
              b.body.setSize(18, 16);
            });
          }
        },
        loop: true
      });
    } else if (this.stage === 3) {
      const s3Interval = Math.round(1400 / this.diffConfig.fireRateMult);
      this.tweens.add({
        targets: this.boss,
        x: { from: 90, to: this.cameras.main.width - 90 },
        yoyo: true,
        repeat: -1,
        duration: 2600 / this.diffConfig.speedMult,
        ease: 'Sine.easeInOut'
      });

      this.bossFireTimer = this.time.addEvent({
        delay: s3Interval,
        callback: () => {
          if (!this.boss || !this.boss.active || this.gameIsOver || this.isDialogueActive || this.isTransitionActive || !this.boss.isReady) return;

          this.enemyFireLaser(this.boss.x, this.boss.y + 45, 0, true);
          this.enemyFireLaser(this.boss.x - 55, this.boss.y + 30, -60);
          this.enemyFireLaser(this.boss.x + 55, this.boss.y + 30, 60);

          if (this.bossPhase >= 2) {
            for (let i = 0; i < 4; i++) {
              const bubble = this.enemyLasers.create(
                this.boss.x + Phaser.Math.Between(-35, 35),
                this.boss.y + 35,
                'dirty_bubble'
              );
              bubble.setVelocity(
                Phaser.Math.Between(-80, 80) * bSpeedMult,
                Phaser.Math.Between(150, 220) * bSpeedMult
              );
            }
          }
        },
        loop: true
      });
    }
  }

  bossDefeated() {
    this.clearDialogue();
    soundManager.playBoom(true);
    this.cameras.main.shake(700, 0.035);
    this.addScore(3000 * this.stage);

    if (this.bossFireTimer) this.bossFireTimer.remove();

    for (let i = 0; i < 14; i++) {
      this.time.delayedCall(i * 65, () => {
        this.createDefeatEffect(
          this.boss.x + Phaser.Math.Between(-45, 45),
          this.boss.y + Phaser.Math.Between(-45, 45)
        );
      });
    }

    this.tweens.add({
      targets: this.boss,
      alpha: 0,
      scaleX: 1.5,
      scaleY: 0.3,
      duration: 800,
      onComplete: () => {
        this.boss.destroy();
        this.bossHpContainer.setVisible(false);
        this.handleStageCompletion();
      }
    });
  }

  handleStageCompletion() {
    this.clearDialogue();

    if (this.stage === 1) {
      soundManager.playPowerUp();
      this.showStoryDialogue('教頭先生', 'ally_pantsman', '「校長先生！助けていただき大感謝です！\n私もパンツの力で援護しますぞ！」', () => {
        this.showStoryDialogue('パンツマン', 'pantsman', '「教頭先生、無事でよかった！\n共に屋上の偽ヒーローを止めに行くぞ！」', () => {
          this.hasAlly = true;
          this.allyLevel = 1;
          this.ally = this.add.sprite(this.player.x - 32, this.player.y + 16, 'ally_pantsman').setDepth(18);
          this.ally.setScale(0.9);

          this.hp = Math.min(this.maxHp, this.hp + 40);
          this.updateHpUI();
          this.bombCount = Math.min(2, this.bombCount + 1);
          this.bombHudText.setText(`🩲x${this.bombCount}`);

          this.showComicText(this.cameras.main.width / 2, 200, 'STAGE 1 CLEAR!\n仲間が合流した！', '#4ade80');
          this.time.delayedCall(1600, () => {
            this.setStageTheme(2);
          });
        });
      });
    } else if (this.stage === 2) {
      soundManager.playPowerUp();
      this.showStoryDialogue('偽ヒーロー', 'boss_fakehero', '「グハッ…！白ブリーフの結束力に\n敗れるとは…！だが地下の巨大トイレが…！」', () => {
        this.showStoryDialogue('パンツマン', 'pantsman', '「地下下水道か！全校生徒の平穏のため、\n元凶の巨大トイレを水に流すぞ！！」', () => {
          this.hp = Math.min(this.maxHp, this.hp + 40);
          this.updateHpUI();
          this.bombCount = 2;
          this.bombHudText.setText(`🩲x${this.bombCount}`);

          this.showComicText(this.cameras.main.width / 2, 200, 'STAGE 2 CLEAR!\n最終ステージへ！', '#4ade80');
          this.time.delayedCall(1600, () => {
            this.setStageTheme(3);
          });
        });
      });
    } else if (this.stage === 3) {
      // ★ 最終ステージクリア時：感動のエンディングシーンへ移行！
      this.triggerEndingSequence();
    }
  }

  // --- 最終ボス撃破後のエンディングシーン起動 ---
  triggerEndingSequence() {
    this.gameIsOver = true;
    soundManager.stopBGM();
    this.clearDialogue();

    const clearSeconds = Math.floor((Date.now() - this.gameStartTime) / 1000);
    let rank = 'C';
    let title = '💧 お漏らし寸前校長';
    if (this.totalDamageTaken === 0 || (this.totalReflects >= 25 && this.score >= 12000)) {
      rank = 'S';
      title = '👑 伝説のパンツマスター校長';
    } else if (this.totalDamageTaken <= 60) {
      rank = 'A';
      title = '🌟 清潔なるブリーフの勇者';
    } else {
      rank = 'B';
      title = '🎖️ 頼れる生活指導主任';
    }

    const prevHigh = parseInt(localStorage.getItem('pantsman_hiscore') || '0', 10);
    const isNewRecord = this.score > prevHigh;
    if (isNewRecord) {
      localStorage.setItem('pantsman_hiscore', this.score);
    }

    this.time.delayedCall(700, () => {
      this.scene.start('EndingScene', {
        score: this.score,
        isNewRecord: isNewRecord,
        rank: rank,
        title: title,
        clearSeconds: clearSeconds,
        totalReflects: this.totalReflects,
        totalDamageTaken: this.totalDamageTaken,
        difficulty: this.difficulty,
        diffLabel: this.diffConfig.name
      });
    });
  }

  showComicText(x, y, text, color = '#facc15') {
    const comic = this.add.text(x, y, text, {
      fontFamily: '"Impact", "Hiragino Kaku Gothic ProN", sans-serif',
      fontSize: '17px',
      fontStyle: 'bold',
      color: color,
      stroke: '#000000',
      strokeThickness: 4,
      align: 'center'
    }).setOrigin(0.5).setDepth(220);

    this.tweens.add({
      targets: comic,
      y: y - 35,
      scale: 1.15,
      alpha: 0,
      duration: 750,
      ease: 'Power1',
      onComplete: () => comic.destroy()
    });
  }

  createDefeatEffect(x, y) {
    const colors = [0xfacc15, 0xef4444, 0x38bdf8, 0x4ade80];
    for (let i = 0; i < 9; i++) {
      const p = this.add.circle(x, y, Phaser.Math.Between(4, 8), Phaser.Utils.Array.GetRandom(colors)).setDepth(45);
      p.setBlendMode(Phaser.BlendModes.ADD);
      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const spd = Phaser.Math.FloatBetween(90, 200);
      this.physics.add.existing(p);
      p.body.setVelocity(Math.cos(angle) * spd, Math.sin(angle) * spd);

      this.tweens.add({
        targets: p,
        alpha: 0,
        scale: 0.1,
        duration: 460,
        onComplete: () => p.destroy()
      });
    }
  }

  addScore(amount) {
    const mult = this.diffConfig ? this.diffConfig.scoreMult : 1.0;
    this.score += Math.round(amount * mult);
    this.scoreText.setText(`SCORE: ${this.score}`);
  }

  triggerGameOver(isVictory) {
    this.gameIsOver = true;
    soundManager.stopBGM();
    this.clearDialogue();
    if (this.spawnTimer) this.spawnTimer.remove();
    if (this.bossFireTimer) this.bossFireTimer.remove();

    const clearSeconds = Math.floor((Date.now() - this.gameStartTime) / 1000);
    let rank = 'C';
    let title = '💧 お漏らし寸前校長';
    if (isVictory) {
      if (this.totalDamageTaken === 0 || (this.totalReflects >= 25 && this.score >= 12000)) {
        rank = 'S';
        title = '👑 伝説のパンツマスター校長';
      } else if (this.totalDamageTaken <= 60) {
        rank = 'A';
        title = '🌟 清潔なるブリーフの勇者';
      } else {
        rank = 'B';
        title = '🎖️ 頼れる生活指導主任';
      }
    }

    const prevHigh = parseInt(localStorage.getItem('pantsman_hiscore') || '0', 10);
    const isNewRecord = this.score > prevHigh;
    if (isNewRecord) {
      localStorage.setItem('pantsman_hiscore', this.score);
    }

    this.time.delayedCall(700, () => {
      this.scene.start('GameOverScene', {
        score: this.score,
        isVictory: isVictory,
        isNewRecord: isNewRecord,
        rank: rank,
        title: title,
        clearSeconds: clearSeconds,
        totalReflects: this.totalReflects,
        totalDamageTaken: this.totalDamageTaken,
        clearedStage: this.stage,
        difficulty: this.difficulty,
        diffLabel: this.diffConfig.name
      });
    });
  }

  update(time, delta) {
    if (this.isDialogueActive || this.isTransitionActive) return;

    let vx = 0;
    let vy = 0;

    if (this.cursors.left.isDown || this.keyA.isDown || this.inputDir.left) vx -= 1;
    if (this.cursors.right.isDown || this.keyD.isDown || this.inputDir.right) vx += 1;
    if (this.cursors.up.isDown || this.keyW.isDown || this.inputDir.up) vy -= 1;
    if (this.cursors.down.isDown || this.keyS.isDown || this.inputDir.down) vy += 1;

    if (this.touchDragTarget) {
      const dx = this.touchDragTarget.x - this.player.x;
      const dy = this.touchDragTarget.y - this.player.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 8) {
        vx = dx / dist;
        vy = dy / dist;
      }
    } else if (vx !== 0 && vy !== 0) {
      vx *= 0.7071;
      vy *= 0.7071;
    }

    this.player.setVelocity(vx * this.playerSpeed, vy * this.playerSpeed);
    this.player.y = Phaser.Math.Clamp(this.player.y, 75, 480);

    if (vx < 0) {
      this.player.setAngle(-6);
    } else if (vx > 0) {
      this.player.setAngle(6);
    } else {
      this.player.setAngle(0);
    }

    if ((vx !== 0 || vy !== 0) && Math.random() < 0.25) {
      const trail = this.add.circle(this.player.x + Phaser.Math.Between(-8, 8), this.player.y + 24, 2, 0xffffff, 0.6).setDepth(18);
      trail.setBlendMode(Phaser.BlendModes.ADD);
      this.tweens.add({
        targets: trail,
        alpha: 0,
        scale: 0.1,
        y: trail.y + 15,
        duration: 250,
        onComplete: () => trail.destroy()
      });
    }

    if (this.hasAlly && this.ally) {
      const targetX = this.player.x - 30;
      const targetY = this.player.y + 14;
      this.ally.x = Phaser.Math.Linear(this.ally.x, targetX, 0.2);
      this.ally.y = Phaser.Math.Linear(this.ally.y, targetY, 0.2);
    }

    if (this.isPressingFire && (!this.bossSpawned || (this.boss && this.boss.isReady))) {
      this.chargeDuration += delta;
      const chargePct = Math.min(1, this.chargeDuration / 700);
      this.chargeBarFill.width = 72 * chargePct;

      if (chargePct >= 1 && !this.isChargeReady) {
        this.isChargeReady = true;
        this.chargeAura.setVisible(true);
        if (!this.chargingSoundPlayed) {
          soundManager.playCharging();
          this.chargingSoundPlayed = true;
        }
      }
    } else {
      this.chargeBarFill.width = 0;
    }

    if (this.chargeAura && this.isChargeReady) {
      this.chargeAura.x = this.player.x;
      this.chargeAura.y = this.player.y - 10;
      this.chargeAura.setScale(1 + Math.sin(time / 80) * 0.15);
    }

    this.bgStars.forEach(s => {
      s.sprite.y += (s.speed * delta) / 1000;
      if (s.sprite.y > 600) {
        s.sprite.y = 0;
        s.sprite.x = Phaser.Math.Between(0, 400);
      }
    });

    this.playerBullets.children.each(b => {
      if (b && (b.y < -30 || b.x < -30 || b.x > 430)) b.destroy();
    });
    this.allyBullets.children.each(b => {
      if (b && (b.y < -30 || b.x < -30 || b.x > 430)) b.destroy();
    });
    this.reflectedBullets.children.each(b => {
      if (b && (b.y < -30 || b.y > 630 || b.x < -30 || b.x > 430)) b.destroy();
    });
    this.enemyLasers.children.each(l => {
      if (l && (l.y > 630 || l.x < -30 || l.x > 430)) l.destroy();
    });
    this.powerItems.children.each(i => {
      if (i && (i.y > 630 || i.x < -30 || i.x > 430)) i.destroy();
    });
    this.healItems.children.each(h => {
      if (h && (h.y > 630 || h.x < -30 || h.x > 430)) h.destroy();
    });

    if (this.shieldGlow) {
      this.shieldGlow.x = this.player.x;
      this.shieldGlow.y = this.player.y - 10;
    }
  }
}

// ===================================================================
// 3. ★ 感動と笑いのエンディングシーン (EndingScene)
// ===================================================================
class EndingScene extends Phaser.Scene {
  constructor() {
    super('EndingScene');
  }

  init(data) {
    this.score = data.score || 0;
    this.isNewRecord = data.isNewRecord || false;
    this.rank = data.rank || 'S';
    this.title = data.title || '👑 伝説のパンツマスター校長';
    this.clearSeconds = data.clearSeconds || 0;
    this.totalReflects = data.totalReflects || 0;
    this.totalDamageTaken = data.totalDamageTaken || 0;
    this.difficulty = data.difficulty || 'normal';
    this.diffLabel = data.diffLabel || 'NORMAL';
  }

  create() {
    generateTextures(this);
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    // フェーズ1: 巨大トイレ水洗シークエンスから開始
    this.bg = this.add.image(width / 2, height / 2, 'bg_stage3').setDepth(0);
    this.vignette = this.add.image(width / 2, height / 2, 'vignette').setDepth(50).setAlpha(0.65);

    this.playFlushSequence();
  }

  // --- フェーズ1: 巨大トイレの完全水洗 ---
  playFlushSequence() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    const toilet = this.add.image(width / 2, 210, 'boss_giant_toilet').setScale(1.15).setDepth(20);
    const hero = this.add.image(width / 2 - 50, 390, 'pantsman').setScale(1.5).setDepth(25);
    const ally = this.add.image(width / 2 + 50, 400, 'ally_pantsman').setScale(1.3).setDepth(24);

    // 激しく震える巨大トイレ
    this.tweens.add({
      targets: toilet,
      x: '+=6',
      yoyo: true,
      repeat: -1,
      duration: 35
    });

    const dialogueCard = this.add.rectangle(width / 2, 490, 360, 80, 0x0f172a, 0.95).setDepth(30);
    dialogueCard.setStrokeStyle(2, 0xfacc15);

    const dialogText = this.add.text(width / 2, 490, 'パンツマン:「悪の元凶・巨大トイレめ！\nすべての罪を…水に流す時が来た！！」', {
      fontSize: '11px',
      fontStyle: 'bold',
      color: '#ffffff',
      align: 'center',
      lineSpacing: 4
    }).setOrigin(0.5).setDepth(31);

    // 巨大な黄金水洗ボタン
    const flushBtn = this.add.rectangle(width / 2, 305, 290, 48, 0xeab308)
      .setInteractive({ useHandCursor: true }).setDepth(35);
    flushBtn.setStrokeStyle(3, 0xffffff);

    const flushBtnText = this.add.text(width / 2, 305, '🚽 水洗ボタンを押す！！ (TAP/SPACE)', {
      fontFamily: '"Impact", "Hiragino Kaku Gothic ProN", sans-serif',
      fontSize: '14px',
      fontStyle: 'bold',
      color: '#0f172a'
    }).setOrigin(0.5).setDepth(36);

    this.tweens.add({
      targets: [flushBtn, flushBtnText],
      scale: 1.08,
      yoyo: true,
      repeat: -1,
      duration: 400
    });

    const doFlush = () => {
      flushBtn.disableInteractive();
      flushBtn.setVisible(false);
      flushBtnText.setVisible(false);

      soundManager.playFlush();
      this.cameras.main.shake(1800, 0.035);

      dialogText.setText('巨大トイレ:「バブバブバブ…ッ！\nき、綺麗になっちゃうううう！！（消滅）」');

      // 渦巻き水流パーティクル
      for (let i = 0; i < 40; i++) {
        this.time.delayedCall(i * 45, () => {
          const drop = this.add.circle(
            width / 2 + Phaser.Math.Between(-90, 90),
            210 + Phaser.Math.Between(-60, 60),
            Phaser.Math.Between(4, 9),
            0x38bdf8
          ).setDepth(22);
          drop.setBlendMode(Phaser.BlendModes.ADD);

          this.tweens.add({
            targets: drop,
            x: width / 2,
            y: 210,
            scale: 0,
            duration: 600,
            ease: 'Cubic.easeIn',
            onComplete: () => drop.destroy()
          });
        });
      }

      // 巨大トイレが回転しながら吸い込まれて消滅！
      this.tweens.add({
        targets: toilet,
        angle: 1440,
        scale: 0,
        duration: 2100,
        ease: 'Cubic.easeIn',
        onComplete: () => {
          toilet.destroy();

          // 画面全体が真っ白に光って朝焼けへ転換
          this.cameras.main.flash(900, 255, 255, 255);
          dialogueCard.destroy();
          dialogText.destroy();
          hero.destroy();
          ally.destroy();

          this.time.delayedCall(700, () => {
            this.playCelebrationSequence();
          });
        }
      });
    };

    flushBtn.on('pointerdown', doFlush);
    this.input.keyboard.once('keydown-SPACE', doFlush);
    this.input.keyboard.once('keydown-ENTER', doFlush);
  }

  // --- フェーズ2: 朝焼けの学校・トイレットペーパー吹雪＆朝礼スピーチ ---
  playCelebrationSequence() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    // 背景を晴れやかな青空の学校へ
    this.bg.setTexture('bg_ending');
    soundManager.playBGM('ending');

    // トイレットペーパーの紙吹雪を降らせる
    this.confettiGroup = [];
    this.confettiTimer = this.time.addEvent({
      delay: 110,
      callback: () => {
        const p = this.add.image(Phaser.Math.Between(10, width - 10), -20, 'confetti_paper')
          .setDepth(15).setScale(Phaser.Math.FloatBetween(0.8, 1.3));
        p.setAngle(Phaser.Math.Between(0, 360));

        this.tweens.add({
          targets: p,
          y: height + 30,
          x: p.x + Phaser.Math.Between(-40, 40),
          angle: p.angle + Phaser.Math.Between(180, 540),
          duration: Phaser.Math.Between(2600, 4200),
          onComplete: () => p.destroy()
        });
      },
      loop: true
    });

    // 朝礼台の上に立つパンツマン＆教頭先生
    const hero = this.add.image(width / 2 - 40, 395, 'pantsman').setScale(1.7).setDepth(20);
    const ally = this.add.image(width / 2 + 40, 410, 'ally_pantsman').setScale(1.4).setDepth(19);

    this.tweens.add({
      targets: [hero, ally],
      y: '-=6',
      yoyo: true,
      repeat: -1,
      duration: 600,
      ease: 'Sine.easeInOut'
    });

    // 生徒たちの歓声バナー
    const cheerBanner = this.add.rectangle(width / 2, 75, 360, 55, 0x0284c7, 0.95).setDepth(30);
    cheerBanner.setStrokeStyle(2, 0xffffff);
    const cheerText = this.add.text(width / 2, 75, '全校生徒:「わあああ！ ペーパーが戻ったー！」\n「ありがとうパンツマン！ ありがとう教頭先生！」', {
      fontSize: '11px',
      fontStyle: 'bold',
      color: '#ffffff',
      align: 'center',
      lineSpacing: 4
    }).setOrigin(0.5).setDepth(31);

    // 朝礼スピーチ会話送り
    const speechLines = [
      {
        speaker: '校長先生（パンツマン）',
        text: '「コホン！ 生徒の諸君、おはよう！\nトイレットペーパーの危機は去った！\n白ブリーフのように清く真っ白な心で学ぶのだ！」'
      },
      {
        speaker: '教頭先生',
        text: '「校長先生、お見事な演説です！\n……ところで校長先生、ズボンはいつ履かれるのですか？」'
      },
      {
        speaker: '校長先生（パンツマン）',
        text: '「…………ハッ！！！\n履くのをすっかり忘れておったーーーーーっ！！！」'
      }
    ];

    let currentLine = 0;

    const dialogBox = this.add.rectangle(width / 2, 490, 360, 85, 0x0f172a, 0.96).setDepth(30);
    dialogBox.setStrokeStyle(2.5, 0xfacc15);

    const speakerText = this.add.text(32, 460, speechLines[0].speaker, {
      fontSize: '11.5px',
      fontStyle: 'bold',
      color: '#facc15'
    }).setDepth(31);

    const contentText = this.add.text(width / 2, 502, speechLines[0].text, {
      fontSize: '11px',
      color: '#ffffff',
      align: 'center',
      lineSpacing: 4
    }).setOrigin(0.5).setDepth(31);

    const nextPrompt = this.add.text(width - 35, 520, '▼ [TAP]', {
      fontSize: '9px',
      color: '#94a3b8'
    }).setOrigin(1, 0.5).setDepth(31);

    const nextSpeech = () => {
      soundManager.playSnap();
      currentLine++;
      if (currentLine < speechLines.length) {
        speakerText.setText(speechLines[currentLine].speaker);
        contentText.setText(speechLines[currentLine].text);
      } else {
        dialogBox.destroy();
        speakerText.destroy();
        contentText.destroy();
        nextPrompt.destroy();
        cheerBanner.destroy();
        cheerText.destroy();
        this.playCreditsSequence();
      }
    };

    dialogBox.setInteractive({ useHandCursor: true }).on('pointerdown', nextSpeech);
    this.input.keyboard.on('keydown-SPACE', nextSpeech);
    this.input.keyboard.on('keydown-ENTER', nextSpeech);
  }

  // --- フェーズ3: キャスト紹介 & スタッフロール ---
  playCreditsSequence() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    const card = this.add.rectangle(width / 2, 280, 360, 330, 0x090e17, 0.94).setDepth(40);
    card.setStrokeStyle(2, 0x38bdf8);

    const congratsText = this.add.text(width / 2, 145, '🎉 ALL STAGES CLEARED!! 🎉', {
      fontFamily: '"Impact", "Hiragino Kaku Gothic ProN", sans-serif',
      fontSize: '20px',
      fontStyle: 'bold',
      color: '#facc15',
      stroke: '#e11d48',
      strokeThickness: 5
    }).setOrigin(0.5).setDepth(41);

    const rollText =
      '【 CAST & STAFF 】\n\n' +
      '★ 主演: 校長先生 / パンツマン\n' +
      '★ 助演: 教頭先生 / ちびパンツマン\n' +
      '★ 敵役: トイレマン / 偽パンツヒーロー / 巨大トイレ\n' +
      '★ 大群: ステテコおじさん / 部長おじさん / ボーナスおじさん\n' +
      '★ 特別協力: 全校生徒のトイレットペーパー (10,000ロール)\n\n' +
      'THANKS FOR PLAYING!!';

    this.add.text(width / 2, 260, rollText, {
      fontSize: '11px',
      fontStyle: 'bold',
      color: '#f8fafc',
      align: 'center',
      lineSpacing: 5
    }).setOrigin(0.5).setDepth(41);

    const resultBtn = this.add.rectangle(width / 2, 400, 290, 48, 0x2563eb)
      .setInteractive({ useHandCursor: true }).setDepth(42);
    resultBtn.setStrokeStyle(3, 0xffffff);

    this.add.text(width / 2, 400, '★ 最終結果発表へ進む [SPACE] ★', {
      fontSize: '14px',
      fontStyle: 'bold',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(43);

    const toResult = () => {
      soundManager.playSnap();
      if (this.confettiTimer) this.confettiTimer.remove();
      this.scene.start('GameOverScene', {
        score: this.score,
        isVictory: true,
        isNewRecord: this.isNewRecord,
        rank: this.rank,
        title: this.title,
        clearSeconds: this.clearSeconds,
        totalReflects: this.totalReflects,
        totalDamageTaken: this.totalDamageTaken,
        clearedStage: 3,
        difficulty: this.difficulty,
        diffLabel: this.diffLabel
      });
    };

    resultBtn.on('pointerdown', toResult);
    this.input.keyboard.once('keydown-SPACE', toResult);
    this.input.keyboard.once('keydown-ENTER', toResult);
  }
}

// ===================================================================
// 4. ゲームオーバー / 完全クリア結果発表シーン
// ===================================================================
class GameOverScene extends Phaser.Scene {
  constructor() {
    super('GameOverScene');
  }

  init(data) {
    this.finalScore = data.score || 0;
    this.isVictory = data.isVictory || false;
    this.isNewRecord = data.isNewRecord || false;
    this.rank = data.rank || 'C';
    this.title = data.title || '💧 お漏らし寸前校長';
    this.clearSeconds = data.clearSeconds || 0;
    this.totalReflects = data.totalReflects || 0;
    this.totalDamageTaken = data.totalDamageTaken || 0;
    this.clearedStage = data.clearedStage || 1;
    this.difficulty = data.difficulty || 'normal';
    this.diffLabel = data.diffLabel || 'NORMAL';
  }

  create() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    this.add.rectangle(width / 2, height / 2, width, height, 0x090e17, 0.95);
    this.add.image(width / 2, height / 2, 'vignette').setDepth(10).setAlpha(0.7);

    const titleText = this.isVictory ? '🎉 全3面完全制覇！！ 🎉' : 'GAME OVER';
    const titleColor = this.isVictory ? '#facc15' : '#ef4444';

    this.add.text(width / 2, 50, titleText, {
      fontFamily: '"Impact", "Hiragino Kaku Gothic ProN", sans-serif',
      fontSize: '24px',
      fontStyle: 'bold',
      color: titleColor,
      stroke: '#000000',
      strokeThickness: 5
    }).setOrigin(0.5).setDepth(20);

    const diffColors = { easy: '#34d399', normal: '#38bdf8', hard: '#f87171' };
    const dColor = diffColors[this.difficulty] || '#38bdf8';
    this.add.text(width / 2, 80, `[ 難易度モード: ${this.diffLabel} ]`, {
      fontSize: '12px',
      fontStyle: 'bold',
      color: dColor,
      backgroundColor: '#0f172a',
      padding: { x: 8, y: 3 }
    }).setOrigin(0.5).setDepth(20);

    const rankColors = { 'S': '#facc15', 'A': '#38bdf8', 'B': '#22c55e', 'C': '#94a3b8' };
    const rColor = rankColors[this.rank] || '#fff';

    const rankBox = this.add.rectangle(width / 2, 122, 110, 40, 0x1e293b).setDepth(20);
    rankBox.setStrokeStyle(3, Phaser.Display.Color.HexStringToColor(rColor).color);

    this.add.text(width / 2, 122, `RANK: ${this.rank}`, {
      fontSize: '20px',
      fontStyle: 'bold',
      color: rColor
    }).setOrigin(0.5).setDepth(21);

    this.add.text(width / 2, 155, this.title, {
      fontSize: '13px',
      fontStyle: 'bold',
      color: '#ffffff',
      backgroundColor: '#1e293b',
      padding: { x: 10, y: 4 }
    }).setOrigin(0.5).setDepth(20);

    const board = this.add.rectangle(width / 2, 280, 330, 160, 0x0f172a, 0.9).setDepth(20);
    board.setStrokeStyle(1.5, 0x38bdf8);

    this.add.text(width / 2, 225, `SCORE: ${this.finalScore} pt`, {
      fontSize: '22px',
      fontStyle: 'bold',
      color: '#facc15'
    }).setOrigin(0.5).setDepth(21);

    const hiScore = localStorage.getItem('pantsman_hiscore') || 0;
    this.add.text(width / 2, 252, `BEST SCORE: ${hiScore} pt`, {
      fontSize: '13px',
      color: '#94a3b8'
    }).setOrigin(0.5).setDepth(21);

    const statsText =
      `到達ステージ: STAGE ${this.clearedStage} / 3\n` +
      `クリアタイム: ${this.clearSeconds} 秒\n` +
      `マント反射成功: ${this.totalReflects} 回\n` +
      `被ダメージ総量: ${this.totalDamageTaken} pt`;

    this.add.text(width / 2, 308, statsText, {
      fontSize: '11.5px',
      color: '#e2e8f0',
      align: 'center',
      lineSpacing: 4
    }).setOrigin(0.5).setDepth(21);

    if (this.isNewRecord) {
      const recordBadge = this.add.text(width / 2, 375, '✨ NEW RECORD! ハイスコア達成! ✨', {
        fontSize: '12px',
        fontStyle: 'bold',
        color: '#facc15',
        backgroundColor: '#854d0e',
        padding: { x: 8, y: 4 }
      }).setOrigin(0.5).setDepth(21);

      this.tweens.add({
        targets: recordBadge,
        scale: 1.08,
        yoyo: true,
        repeat: -1,
        duration: 400
      });
    }

    const retryBtn = this.add.rectangle(width / 2, 440, 260, 48, 0x2563eb)
      .setInteractive({ useHandCursor: true }).setDepth(20);
    retryBtn.setStrokeStyle(3, 0xffffff);

    this.add.text(width / 2, 440, `もう一度 [${this.diffLabel}] [Enter/Space]`, {
      fontSize: '13.5px',
      fontStyle: 'bold',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(21);

    const titleBtn = this.add.rectangle(width / 2, 502, 260, 42, 0x334155)
      .setInteractive({ useHandCursor: true }).setDepth(20);
    this.add.text(width / 2, 502, 'タイトル画面へ [T]', {
      fontSize: '13px',
      fontStyle: 'bold',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(21);

    const doRetry = () => {
      soundManager.playSnap();
      this.scene.start('GameScene', { difficulty: this.difficulty });
    };

    const doTitle = () => {
      soundManager.playSnap();
      this.scene.start('TitleScene');
    };

    retryBtn.on('pointerdown', doRetry);
    titleBtn.on('pointerdown', doTitle);

    this.input.keyboard.on('keydown-ENTER', doRetry);
    this.input.keyboard.on('keydown-SPACE', doRetry);
    this.input.keyboard.on('keydown-T', doTitle);
  }
}

// ===================================================================
// Phaser設定 & 起動
// ===================================================================
const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: 400,
  height: 600,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 0 },
      debug: false
    }
  },
  scene: [TitleScene, GameScene, EndingScene, GameOverScene]
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
