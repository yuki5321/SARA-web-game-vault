<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>走れ！パンツマン - THE HERO 完全版</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: none;
    }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #060911 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Segoe UI', sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      max-width: 400px;
      max-height: 600px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.95), 0 0 35px rgba(56, 189, 248, 0.25), inset 0 0 2px rgba(255,255,255,0.2);
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      overflow: hidden;
      background-color: #090e17;
      position: relative;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
<div id="game-container"></div>

<script>
// ===================================================================
// サウンドエンジン (Web Audio API: ステージBGM, 恐怖ボスBGM, 凱旋エンディング)
// ===================================================================
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.isMuted = false;
    this.bgmTimer = null;
    this.bgmStep = 0;
    this.currentBgmType = null;
    this.currentBgmSpeed = 200;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.isMuted) {
      this.stopBGM();
    } else {
      if (this.currentBgmType) {
        this.playBGM(this.currentBgmType, this.currentBgmSpeed);
      }
    }
    return this.isMuted;
  }

  playBGM(type, customSpeed = null) {
    this.currentBgmType = type;
    this.stopBGM();
    if (this.isMuted || !this.ctx) return;

    let notes = [];
    let speed = 200;
    let waveType = 'triangle';
    let baseVol = 0.08;

    if (type === 'stage1') {
      notes = [130.8, 164.8, 196.0, 164.8, 146.8, 174.6, 220.0, 196.0, 130.8, 196.0, 164.8, 130.8, 146.8, 174.6, 196.0, 220.0];
      speed = 190;
      waveType = 'triangle';
      baseVol = 0.08;
    } else if (type === 'stage2') {
      notes = [164.8, 196.0, 246.9, 196.0, 220.0, 261.6, 329.6, 261.6, 164.8, 220.0, 196.0, 146.8, 174.6, 220.0, 196.0, 164.8];
      speed = 150;
      waveType = 'sawtooth';
      baseVol = 0.06;
    } else if (type === 'stage3') {
      notes = [82.4, 0, 82.4, 98.0, 73.4, 0, 73.4, 110.0, 82.4, 87.3, 82.4, 0, 65.4, 0, 73.4, 82.4];
      speed = 170;
      waveType = 'sawtooth';
      baseVol = 0.09;
    } else if (type === 'boss') {
      notes = [65.4, 69.3, 73.4, 69.3, 65.4, 77.8, 73.4, 61.7, 65.4, 92.5, 87.3, 82.4, 65.4, 69.3, 73.4, 61.7];
      speed = 145;
      waveType = 'sawtooth';
      baseVol = 0.11;
    } else if (type === 'boss_rage') {
      notes = [73.4, 87.3, 110.0, 87.3, 73.4, 98.0, 87.3, 65.4, 73.4, 116.5, 110.0, 98.0, 73.4, 87.3, 98.0, 65.4];
      speed = 110;
      waveType = 'sawtooth';
      baseVol = 0.12;
    } else if (type === 'ending') {
      // 凱旋祝勝ファンファーレ
      notes = [261.6, 329.6, 392.0, 523.3, 392.0, 523.3, 659.3, 523.3, 440.0, 523.3, 659.3, 523.3, 392.0, 329.6, 293.7, 261.6];
      speed = 180;
      waveType = 'triangle';
      baseVol = 0.10;
    }

    if (customSpeed) speed = customSpeed;
    this.currentBgmSpeed = speed;

    this.bgmStep = 0;
    this.bgmTimer = setInterval(() => {
      if (this.isMuted || !this.ctx) return;
      const freq = notes[this.bgmStep % notes.length];
      this.bgmStep++;
      if (freq > 0) {
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = waveType;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(baseVol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (speed / 1000) * 0.9);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + (speed / 1000) * 0.9);
        } catch(e) {}
      }
    }, speed);
  }

  stopBGM() {
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }

  playSnap() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(620, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch(e) {}
  }

  playAllySnap() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.09);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    } catch(e) {}
  }

  playChargeShot() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(950, now + 0.16);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.38);
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.38);
    } catch(e) {}
  }

  playCharging() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.linearRampToValueAtTime(880, now + 0.7);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.7);
    } catch(e) {}
  }

  playBomb() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const dur = 1.2;
      const bufferSize = this.ctx.sampleRate * dur;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.35));
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + dur);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + dur);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    } catch(e) {}
  }

  playCape() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.16;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * (i / bufferSize));
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(500, now);
      filter.frequency.exponentialRampToValueAtTime(140, now + 0.16);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.4, now);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    } catch(e) {}
  }

  playReflect() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [1200, 2400, 3600].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.8, now + 0.26);
        gain.gain.setValueAtTime(0.32 / (idx + 1), now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      });
    } catch(e) {}
  }

  playPowerUp() {
    if (this.isMuted || !this.ctx) return;
    try {
      const notes = [329.6, 392.0, 493.9, 659.3, 987.8];
      const now = this.ctx.currentTime;
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.05);
        gain.gain.setValueAtTime(0.24, now + idx * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.05);
        osc.stop(now + idx * 0.05 + 0.18);
      });
    } catch(e) {}
  }

  playHeal() {
    if (this.isMuted || !this.ctx) return;
    try {
      const notes = [440, 554.3, 659.3, 880];
      const now = this.ctx.currentTime;
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);
        gain.gain.setValueAtTime(0.22, now + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.06);
        osc.stop(now + idx * 0.06 + 0.2);
      });
    } catch(e) {}
  }

  playLaser() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(650, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.13);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    } catch(e) {}
  }

  playDirtyBeam() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(65, now + 0.45);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.45);
    } catch(e) {}
  }

  playBoom(isBoss = false) {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const dur = isBoss ? 0.7 : 0.24;
      const bufferSize = this.ctx.sampleRate * dur;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * (isBoss ? 0.2 : 0.08)));
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(isBoss ? 0.6 : 0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + dur);
      noise.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    } catch(e) {}
  }

  playHurt() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.linearRampToValueAtTime(60, now + 0.2);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } catch(e) {}
  }

  playWarning() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(640, now + 0.25);
      osc.frequency.linearRampToValueAtTime(320, now + 0.5);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.55);
    } catch(e) {}
  }

  // 大迫力の水洗トイレ流水音（ホワイトノイズ＋帯域スイープ）
  playFlush() {
    if (this.isMuted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const dur = 2.4;
      const bufferSize = this.ctx.sampleRate * dur;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1600, now);
      filter.frequency.exponentialRampToValueAtTime(150, now + dur);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.85, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + dur);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    } catch(e) {}
  }
}

const soundManager = new SoundEngine();

// ===================================================================
// グラフィックテクスチャ生成（Canvas動的レンダリング・高品位版）
// ===================================================================
function generateTextures(scene) {
  // 0. シネマティック・ビネット
  if (!scene.textures.exists('vignette')) {
    const c = scene.textures.createCanvas('vignette', 400, 600);
    const ctx = c.getContext();
    const grad = ctx.createRadialGradient(200, 300, 140, 200, 300, 320);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.7, 'rgba(3,7,18,0.2)');
    grad.addColorStop(1, 'rgba(2,6,15,0.7)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 400, 600);
    c.refresh();
  }

  // 0-B. 画面遷移集中線（スピードライン）
  if (!scene.textures.exists('speedlines')) {
    const c = scene.textures.createCanvas('speedlines', 400, 600);
    const ctx = c.getContext();
    ctx.strokeStyle = 'rgba(250, 204, 21, 0.25)';
    ctx.lineWidth = 1.5;
    const cx = 200;
    const cy = 300;
    for (let i = 0; i < 36; i++) {
      const angle = (i / 36) * Math.PI * 2;
      const r1 = 120 + Math.random() * 40;
      const r2 = 380;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
      ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);
      ctx.stroke();
    }
    c.refresh();
  }

  // 0-C. エンディング背景（朝焼け青空の学校）
  if (!scene.textures.exists('bg_ending')) {
    const c = scene.textures.createCanvas('bg_ending', 400, 600);
    const ctx = c.getContext();
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 420);
    skyGrad.addColorStop(0, '#0284c7');
    skyGrad.addColorStop(0.5, '#38bdf8');
    skyGrad.addColorStop(0.85, '#bae6fd');
    skyGrad.addColorStop(1, '#fed7aa');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 400, 420);

    // 太陽の光彩
    const sunGrad = ctx.createRadialGradient(320, 100, 10, 320, 100, 80);
    sunGrad.addColorStop(0, '#ffffff');
    sunGrad.addColorStop(0.4, '#fef08a');
    sunGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(320, 100, 80, 0, Math.PI * 2);
    ctx.fill();

    // 白い雲
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.beginPath();
    ctx.arc(80, 120, 30, 0, Math.PI * 2);
    ctx.arc(115, 110, 40, 0, Math.PI * 2);
    ctx.arc(150, 125, 28, 0, Math.PI * 2);
    ctx.fill();

    // 学校校舎のシルエット
    ctx.fillStyle = '#475569';
    ctx.fillRect(30, 260, 340, 160);
    // 時計塔
    ctx.fillRect(170, 210, 60, 50);
    ctx.beginPath();
    ctx.moveTo(160, 210);
    ctx.lineTo(200, 175);
    ctx.lineTo(240, 210);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(200, 235, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(199, 226, 2, 9);
    ctx.fillRect(200, 234, 7, 2);

    // 校庭の芝生＆朝礼台
    ctx.fillStyle = '#15803d';
    ctx.fillRect(0, 420, 400, 180);
    // 朝礼台
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(100, 440, 200, 50);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 3;
    ctx.strokeRect(100, 440, 200, 50);
    // 階段
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(80, 465, 20, 25);
    ctx.fillRect(300, 465, 20, 25);

    c.refresh();
  }

  // 0-D. 紙吹雪（トイレットペーパーの花吹雪）
  if (!scene.textures.exists('confetti_paper')) {
    const c = scene.textures.createCanvas('confetti_paper', 14, 18);
    const ctx = c.getContext();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(1, 1, 12, 16);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1;
    ctx.strokeRect(1, 1, 12, 16);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(3, 4, 8, 2);
    ctx.fillRect(3, 8, 8, 2);
    c.refresh();
  }

  // 1. パンツマン（校長先生：高品位グラデーション＆ヒーロー装飾）
  if (!scene.textures.exists('pantsman')) {
    const c = scene.textures.createCanvas('pantsman', 64, 76);
    const ctx = c.getContext();

    const capeGrad = ctx.createLinearGradient(0, 26, 0, 72);
    capeGrad.addColorStop(0, '#ef4444');
    capeGrad.addColorStop(0.5, '#dc2626');
    capeGrad.addColorStop(1, '#991b1b');
    ctx.fillStyle = capeGrad;
    ctx.beginPath();
    ctx.moveTo(18, 28);
    ctx.lineTo(2, 72);
    ctx.quadraticCurveTo(18, 68, 32, 72);
    ctx.quadraticCurveTo(46, 68, 62, 72);
    ctx.lineTo(46, 28);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#7f1d1d';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(32, 28, 4, 0, Math.PI * 2);
    ctx.fill();

    const skinGrad = ctx.createLinearGradient(0, 24, 0, 52);
    skinGrad.addColorStop(0, '#fed7aa');
    skinGrad.addColorStop(1, '#fdba74');

      '★ 1面ボスで捕まった仲間を救出すると2面からパワーアップ共闘！';

    this.add.text(width / 2, 275, helpText, {
      fontSize: '10px',
      color: '#f8fafc',
      align: 'left',
      lineSpacing: 4,
      fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(26);

    const highScore = localStorage.getItem('pantsman_hiscore') || 0;
    this.add.text(width / 2, 350, `🏆 最高スコア: ${highScore} pt`, {
      fontSize: '13px',
      color: '#facc15',
      fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(25);

    this.add.text(width / 2, 380, '── 難易度モード選択 ──', {
      fontSize: '12px',
      fontStyle: 'bold',
      color: '#94a3b8'
    }).setOrigin(0.5).setDepth(25);

    this.diffButtons = {};
    const modes = [
      { id: 'easy', label: '🟢 EASY', x: 80, color: 0x10b981, border: 0x34d399, desc: '🟢 EASY: 敵数・弾速・移動が 0.8倍 (のんびり楽しめる)' },
      { id: 'normal', label: '🔵 NORMAL', x: 200, color: 0x0284c7, border: 0x38bdf8, desc: '🔵 NORMAL: 標準バランス (1.0倍 / おすすめ！)' },
      { id: 'hard', label: '🔴 HARD', x: 320, color: 0xbe123c, border: 0xf43f5e, desc: '🔴 HARD: 敵数・弾速・移動が 1.25倍 (超絶弾幕・猛者向け)' }
    ];

    this.diffDescText = this.add.text(width / 2, 452, '', {
      fontSize: '10.5px',
      fontStyle: 'bold',
      color: '#f1f5f9',
      backgroundColor: '#0f172a',
      padding: { x: 10, y: 5 }
    }).setOrigin(0.5).setDepth(26);

    modes.forEach(m => {
      const btn = this.add.rectangle(m.x, 414, 102, 34, m.color)
        .setInteractive({ useHandCursor: true }).setDepth(25);
      btn.setStrokeStyle(2, 0xffffff);

      const label = this.add.text(m.x, 414, m.label, {
        fontSize: '12px',
        fontStyle: 'bold',
        color: '#ffffff'
      }).setOrigin(0.5).setDepth(26);

      btn.on('pointerdown', () => {
        this.selectDifficulty(m.id);
      });

      this.diffButtons[m.id] = { rect: btn, label: label, data: m };
    });

    this.startBtn = this.add.rectangle(width / 2, 528, 310, 48, 0xe11d48)
      .setInteractive({ useHandCursor: true }).setDepth(25);
    this.startBtn.setStrokeStyle(3, 0xffffff);

    this.startText = this.add.text(width / 2, 528, '', {
      fontSize: '14.5px',
      fontStyle: 'bold',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(26);

    this.tweens.add({
      targets: [this.startBtn, this.startText],
      scale: 1.04,
      yoyo: true,
      repeat: -1,
      duration: 650
    });

    this.selectDifficulty(this.selectedDifficulty);

    const startGame = () => {
      soundManager.init();
      soundManager.playSnap();
      this.scene.start('GameScene', { difficulty: this.selectedDifficulty });
    };

    this.startBtn.on('pointerdown', startGame);
    this.input.keyboard.on('keydown-ENTER', startGame);
    this.input.keyboard.on('keydown-SPACE', startGame);

    this.input.keyboard.on('keydown-ONE', () => this.selectDifficulty('easy'));
    this.input.keyboard.on('keydown-TWO', () => this.selectDifficulty('normal'));
    this.input.keyboard.on('keydown-THREE', () => this.selectDifficulty('hard'));
    this.input.keyboard.on('keydown-LEFT', () => {
      const order = ['easy', 'normal', 'hard'];
      const idx = order.indexOf(this.selectedDifficulty);
      if (idx > 0) this.selectDifficulty(order[idx - 1]);
    });
    this.input.keyboard.on('keydown-RIGHT', () => {
      const order = ['easy', 'normal', 'hard'];
      const idx = order.indexOf(this.selectedDifficulty);
      if (idx < 2) this.selectDifficulty(order[idx + 1]);
    });
  }

  selectDifficulty(diffId) {
    this.selectedDifficulty = diffId;
    localStorage.setItem('pantsman_difficulty', diffId);
    soundManager.playSnap();

    Object.keys(this.diffButtons).forEach(id => {
      const b = this.diffButtons[id];
      const isSelected = (id === diffId);
      if (isSelected) {
        b.rect.setStrokeStyle(3, 0xfacc15);
        b.rect.setScale(1.08);
        b.label.setScale(1.08);
        this.diffDescText.setText(b.data.desc);
      } else {
        b.rect.setStrokeStyle(1.5, 0x64748b);
        b.rect.setScale(1.0);
        b.label.setScale(1.0);
      }
    });

    const diffUpper = diffId.toUpperCase();
    this.startText.setText(`★ START [${diffUpper}] (SPACE / ENTER) ★`);

    const colors = { easy: 0x059669, normal: 0x0284c7, hard: 0xbe123c };
    this.startBtn.setFillStyle(colors[diffId] || 0xe11d48);
  }
}

class GameScene extends Phaser.Scene {
  constructor() {
    super('GameScene');
  }

  init(data) {
    this.difficulty = (data && data.difficulty) ? data.difficulty : (localStorage.getItem('pantsman_difficulty') || 'normal');

    const diffConfigs = {
      easy: {
        id: 'easy',
        name: 'EASY',
        badgeColor: 0x10b981,
        badgeTextColor: '#34d399',
        enemyCountMult: 0.8,
        speedMult: 0.8,
        fireRateMult: 0.8,
        bulletSpeedMult: 0.8,
        bossHpMult: 0.8,
        scoreMult: 0.8
      },
      normal: {
        id: 'normal',
        name: 'NORMAL',
        badgeColor: 0x0284c7,
        badgeTextColor: '#38bdf8',
        enemyCountMult: 1.0,
        speedMult: 1.0,
        fireRateMult: 1.0,
        bulletSpeedMult: 1.0,
        bossHpMult: 1.0,
        scoreMult: 1.0
      },
      hard: {
        id: 'hard',
        name: 'HARD',
        badgeColor: 0xbe123c,
        badgeTextColor: '#f87171',
        enemyCountMult: 1.25,
        speedMult: 1.25,
        fireRateMult: 1.25,
        bulletSpeedMult: 1.25,
        bossHpMult: 1.25,
        scoreMult: 1.25
      }
    };
    this.diffConfig = diffConfigs[this.difficulty] || diffConfigs.normal;

    this.score = 0;
    this.hp = 100;
    this.maxHp = 100;
    this.playerSpeed = 260;
    this.isShieldActive = false;
    this.shieldCooldown = false;
    this.attackLevel = 1;
    this.stage = 1;
    this.stageDefeated = 0;
    this.stageRequiredEnemies = 8;
    this.boss = null;
    this.bossSpawned = false;
    this.bossMaxHp = Math.round(220 * this.diffConfig.bossHpMult);
    this.bossPhase = 1;
    this.gameIsOver = false;
    this.isInvincible = false;
    this.lastShotTime = 0;
    this.shotCooldownMs = 230;

    this.hasAlly = false;
    this.ally = null;
    this.allyLevel = 1;

    this.bombCount = 2;

    this.chargeDuration = 0;
    this.isChargeReady = false;
    this.chargingSoundPlayed = false;

    this.reflectCombo = 0;
    this.lastReflectTime = 0;
    this.totalReflects = 0;
    this.totalDamageTaken = 0;
    this.gameStartTime = Date.now();

    // 会話・カットイン管理
    this.isDialogueActive = false;
    this.currentDialogGroup = null;
    this.dialogueTimer = null;
    this.dialogueBarrier = null;
    this.dialogueKeyDownHandler = null;

    this.isTransitionActive = false;
    this.pinchDialogueTriggered = false;

    this.inputDir = { up: false, down: false, left: false, right: false };
    this.isPressingFire = false;
    this.touchDragTarget = null;
  }

  create() {
    generateTextures(this);
    soundManager.init();

    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    this.bgImage = this.add.image(width / 2, height / 2, 'bg_stage1').setDepth(0);
    this.add.image(width / 2, height / 2, 'vignette').setDepth(190).setAlpha(0.5);

    this.stageBanner = this.add.text(width / 2, 72, '【STAGE 1: 校長室の決戦】', {
      fontSize: '11px',
      fontStyle: 'bold',
      color: '#fde047',
      backgroundColor: '#0f172a',
      padding: { x: 8, y: 3 }
    }).setOrigin(0.5).setDepth(10);

    this.bgStars = [];
    for (let i = 0; i < 24; i++) {
      const star = this.add.circle(
        Phaser.Math.Between(0, width),
        Phaser.Math.Between(0, height),
        Phaser.Math.Between(1, 2.5),
        0x94a3b8,
        0.35
      ).setDepth(1);
      this.bgStars.push({ sprite: star, speed: Phaser.Math.Between(25, 60) });
    }

    this.playerBullets = this.physics.add.group();
    this.allyBullets = this.physics.add.group();
    this.reflectedBullets = this.physics.add.group();
    this.enemies = this.physics.add.group();
    this.enemyLasers = this.physics.add.group();
    this.powerItems = this.physics.add.group();
    this.healItems = this.physics.add.group();

    this.player = this.physics.add.sprite(width / 2, height - 140, 'pantsman').setDepth(20);
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(38, 52);

    this.chargeAura = this.add.circle(this.player.x, this.player.y, 42, 0xfacc15, 0.4).setDepth(19);
    this.chargeAura.setStrokeStyle(3, 0xffffff);
    this.chargeAura.setVisible(false);

    this.shieldGlow = this.add.ellipse(this.player.x, this.player.y - 8, 88, 88, 0x38bdf8, 0.45).setDepth(21);
    this.shieldGlow.setStrokeStyle(4, 0x00f0ff);
    this.shieldGlow.setVisible(false);

    this.bombFlash = this.add.rectangle(width / 2, height / 2, width, height, 0xffffff)
      .setAlpha(0).setDepth(250);

    this.cursors = this.input.keyboard.createCursorKeys();
    this.keyW = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W);
    this.keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
    this.keyS = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S);
    this.keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);

    this.keyZ = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);
    this.keySpace = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.keyJ = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.J);

    const onFireDown = () => {
      if (!this.isDialogueActive && !this.isTransitionActive && (!this.bossSpawned || (this.boss && this.boss.isReady))) {
        this.isPressingFire = true;
      }
    };
    const onFireUp = () => { this.handleFireRelease(); };

    this.keyZ.on('down', onFireDown);
    this.keySpace.on('down', onFireDown);
    this.keyJ.on('down', onFireDown);
    this.keyZ.on('up', onFireUp);
    this.keySpace.on('up', onFireUp);
    this.keyJ.on('up', onFireUp);

    this.keyX = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.X);
    this.keyC = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.C);
    this.keyK = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.K);
    this.keyShift = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);

    const triggerShield = () => {
      if (!this.isDialogueActive && !this.isTransitionActive && (!this.bossSpawned || (this.boss && this.boss.isReady))) {
        this.actionActivateShield();
      }
    };
    this.keyX.on('down', triggerShield);
    this.keyC.on('down', triggerShield);
    this.keyK.on('down', triggerShield);
    this.keyShift.on('down', triggerShield);

    this.keyB = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.B);
    this.keyV = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.V);
    const triggerBomb = () => {
      if (!this.isDialogueActive && !this.isTransitionActive && (!this.bossSpawned || (this.boss && this.boss.isReady))) {
        this.actionUseBomb();
      }
    };
    this.keyB.on('down', triggerBomb);
    this.keyV.on('down', triggerBomb);

    this.createHUD();
    this.createControlsUI(width, height);
    this.setupTouchDragControls();
    this.setupColliders();

    // ★ ゲーム開始時：大迫力のパンツマン登場カットインアニメーション！
    this.playStageIntroAnimation(1, () => {
      this.startStageCombat();
    });
  }

  // --- ステージ開始時の敵スポーン＆タイマー開始 ---
  startStageCombat() {
    const baseSpawnDelay = Math.round(2600 / this.diffConfig.speedMult);
    if (this.spawnTimer) this.spawnTimer.remove();
    this.spawnTimer = this.time.addEvent({
      delay: baseSpawnDelay,
      callback: this.spawnEnemyWave,
      callbackScope: this,
      loop: true
    });

    if (this.itemDropTimer) this.itemDropTimer.remove();
    this.itemDropTimer = this.time.addEvent({
      delay: 11000,
      callback: () => {
        if (!this.gameIsOver && this.attackLevel < 5 && !this.isDialogueActive && !this.isTransitionActive) {
          this.spawnPowerItem(Phaser.Math.Between(60, this.cameras.main.width - 60), 40);
        }
      },
      loop: true
    });

    soundManager.playBGM(`stage${this.stage}`);
  }

  // =================================================================
  // ★ 画面遷移・パンツマン特大カットイン演出（開始＆面進み時）
  // =================================================================
  playStageIntroAnimation(stageNum, onComplete) {
    this.isTransitionActive = true;
    this.clearDialogue();
    this.player.setVelocity(0, 0);

    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    soundManager.playPowerUp();

    const overlay = this.add.container(0, 0).setDepth(300);

    // 暗転＆集中線
    const darkBg = this.add.rectangle(width / 2, height / 2, width, height, 0x060911, 0.88);
    const speedlines = this.add.image(width / 2, height / 2, 'speedlines').setScale(1.2).setAlpha(0.65);

    this.tweens.add({
      targets: speedlines,
      angle: 360,
      duration: 10000,
      repeat: -1
    });

    // ステージタイトルバナー
    const stageTitles = {
      1: '【 STAGE 1: 校長室の決戦 】',
      2: '【 STAGE 2: 夕暮れの学校屋上 】',
      3: '【 FINAL STAGE: 地下下水要塞 】'
    };
    const titleBanner = this.add.rectangle(width / 2, 85, 340, 36, 0x0f172a, 0.95);
    titleBanner.setStrokeStyle(2, 0xfacc15);
    const titleText = this.add.text(width / 2, 85, stageTitles[stageNum] || `STAGE ${stageNum}`, {
      fontFamily: '"Impact", "Hiragino Kaku Gothic ProN", sans-serif',
      fontSize: '15px',
      fontStyle: 'bold',
      color: '#facc15'
    }).setOrigin(0.5);

    // ★ 特大パンツマン（スケール2.4倍）のヒーローカットイン！
    const bigHero = this.add.image(stageNum === 1 ? width / 2 : width / 2 - 45, 235, 'pantsman')
      .setScale(0.5).setAlpha(0);

    // 黄金オーラ
    const heroAura = this.add.circle(bigHero.x, bigHero.y, 65, 0xfacc15, 0.35);
    heroAura.setStrokeStyle(3, 0xffffff);
    heroAura.setScale(0.5).setAlpha(0);

    let bigAlly = null;
    if (stageNum >= 2) {
      bigAlly = this.add.image(width / 2 + 55, 250, 'ally_pantsman').setScale(0.5).setAlpha(0);
    }

    // スムーズなズーム＆スライドイン
    this.tweens.add({
      targets: [bigHero, heroAura],
      scale: 2.3,
      alpha: 1,
      duration: 450,
      ease: 'Back.easeOut'
    });

    if (bigAlly) {
      this.tweens.add({
        targets: bigAlly,
        scale: 1.85,
        alpha: 1,
        duration: 500,
        delay: 150,
        ease: 'Back.easeOut'
      });
    }

    // かっこいい決めゼリフ！
    const quotes = {
      1: '「全校生徒の平和と白いブリーフは、\n私が守る！ パンツマン、いざ出撃！！」',
      2: '「教頭先生、背中は任せたぞ！\n夕陽に輝く純潔の力、悪党に見せてやる！！」',
      3: '「ここが奴らの本拠地か…！\n最後の水洗ボタンは私たちが押す！ 全力全開！！」'
    };

    const speechCard = this.add.rectangle(width / 2, 400, 360, 95, 0x0f172a, 0.95);
    speechCard.setStrokeStyle(2.5, 0x38bdf8);

    const speakerBadge = this.add.text(width / 2, 364, '⚡ 愛と正義の校長: パンツマン ⚡', {
      fontSize: '11px',
      fontStyle: 'bold',
      color: '#fde047',
      backgroundColor: '#7f1d1d',
      padding: { x: 8, y: 3 }
    }).setOrigin(0.5);

    const speechText = this.add.text(width / 2, 412, quotes[stageNum] || '「行くぞ！！」', {
      fontSize: '12px',
      fontStyle: 'bold',
      color: '#ffffff',
      align: 'center',
      lineSpacing: 5
    }).setOrigin(0.5);

    const readyText = this.add.text(width / 2, 490, '★ READY... FIGHT!! ★', {
      fontFamily: '"Impact", "Hiragino Kaku Gothic ProN", sans-serif',
      fontSize: '22px',
      fontStyle: 'bold',
      color: '#f43f5e',
      stroke: '#ffffff',
      strokeThickness: 4
    }).setOrigin(0.5);

    this.tweens.add({
      targets: readyText,
      scale: 1.15,
      yoyo: true,
      repeat: -1,
      duration: 350
    });

    const skipPrompt = this.add.text(width / 2, 535, '▼ [TAP / SPACE でスキップ]', {
      fontSize: '10px',
      color: '#94a3b8'
    }).setOrigin(0.5);

    overlay.add([darkBg, speedlines, titleBanner, titleText, heroAura, bigHero]);
    if (bigAlly) overlay.add(bigAlly);
    overlay.add([speechCard, speakerBadge, speechText, readyText, skipPrompt]);

    const finishIntro = () => {
      if (!this.isTransitionActive) return;
      this.isTransitionActive = false;

      this.cameras.main.shake(180, 0.015);
      soundManager.playSnap();

      this.tweens.add({
        targets: overlay,
        alpha: 0,
        duration: 250,
        onComplete: () => {
          overlay.destroy();
          if (onComplete) onComplete();
        }
      });
    };

    darkBg.setInteractive().on('pointerdown', finishIntro);
    speechCard.setInteractive().on('pointerdown', finishIntro);

    const spaceListener = (e) => {
      if (['Space', 'Enter', 'KeyZ'].includes(e.code)) {
        window.removeEventListener('keydown', spaceListener);
        finishIntro();
      }
    };
    window.addEventListener('keydown', spaceListener, { once: true });

    // 2.7秒後に自動でゲームスタート
    this.time.delayedCall(2700, () => {
      window.removeEventListener('keydown', spaceListener);
      finishIntro();
    });
  }

  // --- ステージテーマ切り替え ---
  setStageTheme(stageNum) {
    this.stage = stageNum;
    this.stageDefeated = 0;
    this.bossSpawned = false;
    this.boss = null;
    this.bossHpContainer.setVisible(false);
    this.clearDialogue();

    let stageName = '';
    let bgTexture = 'bg_stage1';

    if (stageNum === 1) {
      stageName = '【STAGE 1: 校長室の決戦】';
      bgTexture = 'bg_stage1';
      this.bossMaxHp = Math.round(220 * this.diffConfig.bossHpMult);
      this.stageRequiredEnemies = 8;
    } else if (stageNum === 2) {
      stageName = '【STAGE 2: 屋上・偽ヒーローの罠】';
      bgTexture = 'bg_stage2';
      this.bossMaxHp = Math.round(360 * this.diffConfig.bossHpMult);
      this.stageRequiredEnemies = 10;
    } else if (stageNum === 3) {
      stageName = '【STAGE 3: 地下下水道・巨大トイレ要塞】';
      bgTexture = 'bg_stage3';
      this.bossMaxHp = Math.round(550 * this.diffConfig.bossHpMult);
      this.stageRequiredEnemies = 12;

    this.bossCountText.setText(`BOSSまで: ${this.stageRequiredEnemies}体`);
    this.bgImage.setTexture(bgTexture);

    // ★ ステージ進む際の画面遷移アニメーション発火！
    this.playStageIntroAnimation(stageNum, () => {
      this.startStageCombat();
    });
  }

  createDirButton(x, y, label, dirKey) {
    const btn = this.add.rectangle(x, y, 24, 24, 0x1e293b, 0.9)

      .setStrokeStyle(1.5, 0x475569);

      .setOrigin(0.5).setDepth(102);

    btn.on('pointerup', () => { this.inputDir[dirKey] = false; btn.setFillStyle(0x1e293b); });
