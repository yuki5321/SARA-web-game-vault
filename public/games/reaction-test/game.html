<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>反応速度テスト</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 14px; background: #f6f5ff; color: #20233c; font-family: system-ui, sans-serif; touch-action: manipulation; }
    main { width: min(100%, 460px); text-align: center; }
    h1 { margin: 0 0 4px; font-size: clamp(1.35rem, 6vw, 2rem); }
    .sub { margin: 0 0 14px; color: #777b91; font-size: .9rem; }
    .stats { display: flex; justify-content: space-between; margin: 0 auto 10px; max-width: 400px; font-size: .95rem; font-weight: 750; }
    #pad { display: grid; place-items: center; width: min(100%, 400px); aspect-ratio: 1; margin: auto; padding: 16px; border: 0; border-radius: 20px; background: #dedcf4; color: #3d3680; font: inherit; font-size: clamp(1.1rem, 6vw, 1.6rem); font-weight: 800; cursor: pointer; touch-action: manipulation; user-select: none; }
    #pad.waiting { background: #e5532d; color: #fff; }
    #pad.go { background: #2fb36d; color: #fff; }
    #pad.result { background: #fff; color: #3d3680; box-shadow: inset 0 0 0 3px #dedcf4; }
    #message { min-height: 1.5em; margin: 12px 0 0; color: #5748d4; font-weight: 750; }
  </style>
</head>
<body>
  <main>
    <h1>反応速度テスト</h1>
    <p class="sub">緑になったらすぐタップ！</p>
    <div class="stats"><span>前回: <b id="last">—</b></span><span>ベスト: <b id="best">—</b></span></div>
    <button id="pad" type="button">タップしてスタート</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const storageKey = "vault_reaction-test_best";
      const pad = document.getElementById("pad");
      const lastElement = document.getElementById("last");
      const bestElement = document.getElementById("best");
      const messageElement = document.getElementById("message");
      let best = Number(localStorage.getItem(storageKey)) || 0;
      let state = "idle";
      let timerId;
      let goTime = 0;

      function renderBest() {
        bestElement.textContent = best ? `${best}ms` : "—";
      }

      function ready() {
        state = "waiting";
        pad.className = "waiting";
        pad.textContent = "緑になるまで待って…";
        messageElement.textContent = "";
        timerId = window.setTimeout(() => {
          state = "go";
          pad.className = "go";
          pad.textContent = "今すぐタップ！";
          goTime = performance.now();
        }, 1500 + Math.random() * 2500);
      }

      function tap() {
        if (state === "idle" || state === "result" || state === "early") {
          ready();
          return;
        }
        if (state === "waiting") {
          window.clearTimeout(timerId);
          state = "early";
          pad.className = "result";
          pad.textContent = "早すぎ！タップして再挑戦";
          messageElement.textContent = "緑になってからタップしてください。";
          return;
        }
        if (state === "go") {
          const time = Math.round(performance.now() - goTime);
          state = "result";
          pad.className = "result";
          pad.textContent = `${time}ms　タップして再挑戦`;
          lastElement.textContent = `${time}ms`;
          if (!best || time < best) {
            best = time;
            localStorage.setItem(storageKey, String(best));
            renderBest();
            messageElement.textContent = "新記録です！";
          } else {
            messageElement.textContent = "";
          }
        }
      }

      pad.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        tap();
      });
      pad.addEventListener("keydown", (event) => {
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          tap();
        }
      });
      renderBest();
    })();
  </script>
</body>
</html>
